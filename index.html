  return '<fin-transfer-form><form id="transferForm" novalidate>' + '<div id="formTotal">' + finAmountDisplay(formTotal()) + '</div>' + finTextField('Descripción', 'Descripción (opcional)', F.description, 120, 'description') +
    finListGroup(sourceRow, '', 'dt-from') + finListGroup(rows + finAddRow('Agregar adicional', !canAdd), '', 'dt-to') +
    (noDestinations ? finHint('Este origen no tiene destinos habilitados. Configúralos en Configuración › Destinos permitidos.') : '') +
    /* V2-008: una recurrente no tiene fecha; en su lugar va la repetición */
    (F.recurring ? recurrenceGroupHtml() : finListGroup(finInputRow('calendar', 'Fecha', 'date', F.date, '', 'date') + (future ? finSwitchRow('circle-clock', 'Completar automáticamente', F.autoComplete, 'autoComplete') : '')) +
    finHint(dateHint)) + '<div id="formError">' + finFormError(F.error) + '</div></form></fin-transfer-form>';
}
/* Vuelve a dibujar el formulario (conserva lo escrito: todo vive en F). */
function redrawForm() {
  const step = $('#formStep'); step.innerHTML = transferFormHtml();
  formSheet.setConfirmDisabled(!canSaveForm());
  formSheet.setHeader(formTitles());
}
function setFormError(message) { F.error = message; const el = $('#formError'); if (el) el.innerHTML = finFormError(message); }
/* Actualiza solo lo que depende de los montos (así el cursor no se pierde al escribir). */
function updateTotals() {
  $('#formTotal').innerHTML = finAmountDisplay(formTotal());
  const source = accountById(F.sourceId), value = $('#sourceValue');
  if (value && source) { const v = sourceValue(); value.textContent = formatMoney(v); value.classList.toggle('neg', v < 0 && !source.allowNegativeBalance); }
  const dest = $('#destValue'); if (dest) dest.textContent = formatMoney(mainDestinationValue());
  const sum = $('#mainSum'); if (sum) sum.textContent = fromCents(F.rows[0].amount);
  formSheet.setConfirmDisabled(!canSaveForm());
}
/* V2-004: con desglose, el monto del principal es la suma de los conceptos y la descripción, sus nombres */
function applyBreakdown() {
  if (!F.breakdown) return;
  const row = F.rows[0], total = F.breakdown.reduce((n, c) => n + c.amount, 0);
  row.amount = total; row.amountText = total ? fromCents(total) : '';
  F.description = conceptsText(F.breakdown); F.breakdownDescription = F.description;
  const d = $('#transferForm [data-field="description"]'); if (d) d.value = F.description;
}
function wireForm() {
  formSheet.body.addEventListener('input', e => {
    if (!F) return;
    const t = e.target;
    if (t.dataset.field === 'description') { F.description = t.value; setFormError(null); }
    else if (t.dataset.row !== undefined) {
      const row = F.rows[Number(t.dataset.row)];
      row.amountText = t.value; row.amount = Math.max(0, toCents(t.value)); setFormError(null); updateTotals();
    } else if (t.dataset.field === 'query') {
      F.pick.query = t.value; renderPickerList();
    } else if (t.dataset.concept !== undefined) {   /* V2-004 */
      F.breakdown[Number(t.dataset.concept)].concept = t.value; applyBreakdown(); setFormError(null); updateTotals();
    } else if (t.dataset.conceptAmount !== undefined) {
      const c = F.breakdown[Number(t.dataset.conceptAmount)];
      c.amountText = t.value; c.amount = Math.max(0, toCents(t.value)); applyBreakdown(); setFormError(null); updateTotals();
    }
  });
  formSheet.body.addEventListener('change', e => {
    if (!F) return;
    const t = e.target;
    if (t.dataset.field === 'date') {

      if (!isFutureDate()) F.autoComplete = false;
      setFormError(null); redrawForm();
    } else if (t.dataset.field === 'autoComplete') { F.autoComplete = t.checked; redrawForm(); }
    else if (t.dataset.field === 'recEndDate') { F.repeat.endDate = t.value || F.repeat.endDate; redrawForm(); }   /* V2-008 */
    else if (t.dataset.field === 'recActive') { F.active = t.checked; redrawForm(); }

const focusInForm = selector => { const el = $('#transferForm ' + selector); if (el) el.focus({ preventScroll: true }); };
actions['pick-source'] = () => openPicker({ row: -1, usedIds: [], selectedId: F.sourceId });
actions['pick-destination'] = el => openPicker(pickRequestFor(Number(el.dataset.index)));
actions['add-additional'] = () => {
  const row = newRow(); F.rows.push(row); F.newRowKey = row.key; setFormError(null); redrawForm();
  openPicker(pickRequestFor(F.rows.length - 1));
};
actions['remove-row'] = el => {
  const index = Number(el.dataset.index), swipe = el.closest('fin-swipe-row');
  removeSwipeRow(swipe, () => { F.rows.splice(index, 1); setFormError(null); redrawForm(); });
};
/* V2-004: abrir el desglose; el primer concepto parte del monto ya escrito */
actions['open-breakdown'] = () => {
  const row = F.rows[0];
  F.breakdown = [newConcept('', row.amount, row.amountText)]; applyBreakdown(); setFormError(null); redrawForm(); focusInForm('[data-concept="0"]');
};
actions['add-concept'] = () => {
  F.breakdown.push(newConcept()); setFormError(null); redrawForm(); focusInForm('[data-concept="' + (F.breakdown.length - 1) + '"]');
};
/* Sin conceptos, el monto vuelve a escribirse a mano (conserva la última suma) y se limpia la descripción generada */
actions['remove-concept'] = el => {
  F.breakdown.splice(Number(el.dataset.index), 1); setFormError(null);
  if (F.breakdown.length === 0) {
    F.breakdown = null;
    if (F.description === F.breakdownDescription) F.description = '';
    F.breakdownDescription = '';
    redrawForm(); focusInForm('[data-row="0"]');
  } else { applyBreakdown(); redrawForm(); }
};
function pickRequestFor(index) {
  return { row: index, usedIds: F.rows.filter((_, i) => i !== index).map(r => r.accountId).filter(id => id !== null), selectedId: F.rows[index].accountId };
}
/* Cambia el origen: los destinos dependen de él, así que se empieza con una sola fila vacía. */
function resetForNewSource() {
  F.rows = [newRow()];
  if (F.description === F.defaultDescription || F.description === F.breakdownDescription) F.description = '';
  F.defaultDescription = ''; F.error = null;
  F.breakdown = null; F.breakdownDescription = '';   /* el desglose era del destino anterior */
}
/* Asigna la cuenta de una fila y propone los valores del destino permitido: su monto si la fila no tiene uno, y su
   descripción en la principal si el usuario no escribió otra. */
function setDestination(index, accountId) {
  const row = F.rows[index]; if (!row) return;
  row.accountId = accountId;
  const preset = findDestination(F.sourceId, accountId);
  if (preset && row.amount === 0) { row.amount = preset.defaultAmount; row.amountText = preset.defaultAmount ? fromCents(preset.defaultAmount) : ''; }
  if (index === 0 && preset && (!F.description || F.description === F.defaultDescription)) { F.description = preset.defaultDescription || ''; F.defaultDescription = F.description; }
  F.error = null;

function saveTransfer() {

  F.error = null;

    lines: F.rows.map(r => ({ accountId: r.accountId, amount: r.amount })),
    breakdown: F.breakdown ? F.breakdown.map(c => ({ concept: c.concept, amount: c.amount })) : null };   /* V2-001 / V2-004 */
  try {
    const id = draft.id ? (editTransfer(draft), draft.id) : createTransfer(draft);
    closeFormSheet();
    const parent = getTransfer(id)[0];
    if (parent) onTransferSaved(parent.status);

/* La lista que abrió la hoja pasa a mostrar el estado de la transferencia recién guardada (Transferencias y página de cuenta). */

/* ---- Selector de cuentas (fin-account-picker): dentro de la misma hoja, con buscador ---- */
function pickAccountsFor(req) {
  if (req.row < 0) return sourceAccounts();
  const allowed = allowedAccounts(F.sourceId, req.row !== 0), free = allowed.filter(a => req.usedIds.indexOf(a.id) < 0);
  const selected = accountById(req.selectedId);
  return selected && !free.some(a => a.id === selected.id) ? free.concat(selected) : free;
}
function openPicker(req) {

  F.step = 'picker';
  const formStep = $('#formStep'); formStep.hidden = true; formStep.classList.remove('back-from-picker');
  const el = document.createElement('div'); el.id = 'pickerHost'; el.innerHTML = pickerHtml();

function pickerHtml() {

  const groups = typesBySort().map(type => ({ type, accounts: accounts.filter(a => a.accountTypeId === type.id && (!search || normalize(a.name).includes(search) || normalize(type.name).includes(search))) })).filter(g => g.accounts.length > 0);
  const message = accounts.length === 0 ? (req.row < 0 ? NO_SOURCES_MESSAGE : NO_DESTINATIONS_MESSAGE) : groups.length === 0 ? 'Sin resultados para «' + req.query.trim() + '».' : '';
  return '<fin-account-picker>' + finSearchField('Buscar cuenta', req.query) + '<div role="listbox" aria-label="Cuentas" id="pickerList">' + pickerListHtml(groups) + '</div>' + (message ? finEmptyState(message) : '') + '</fin-account-picker>';
}
function pickerListHtml(groups) {

    '<fin-account-picker-row><button type="button" class="ap-row" role="option" aria-selected="' + (a.id === F.pick.selectedId) + '" data-act="pick-account" data-id="' + a.id + '">' + finAccountIcon(g.type.icon, a.color) +
    '<span class="ap-n">' + esc(a.name) + '</span>' + (F.pick.row < 0 ? '<span class="ap-v">' + esc(formatMoney(a.currentBalance)) + '</span>' : '') + (a.id === F.pick.selectedId ? finIcon('check', 'ap-ok') : '') + '</button></fin-account-picker-row>').join(''))).join('');
}
/* La búsqueda ignora tildes y mayúsculas y mira el nombre de la cuenta y el de su tipo. */
function renderPickerList() {
  const host = $('#pickerHost'); if (!host) return;
  const input = host.querySelector('input'), had = document.activeElement === input, pos = input.selectionStart;
  host.innerHTML = pickerHtml();

function closePicker() {

}
actions['pick-account'] = el => {

  else if (accountId === F.sourceId) closePicker();
  else {
    /* Con otro origen los destinos se reinician; se sigue con el selector del destino */

/* ---- Detalle de una transferencia (fin-transfer-detail) ---- */
let detailSheet = null, detailId = null, detailError = null;
function openDetail(id) {
  detailId = id; detailError = null;
  if (detailSheet) detailSheet.close();
  detailSheet = openSheet({ title: 'Transferencia', showConfirm: false, initialFocus: 'close', body: '', onClose: closeDetail });
  renderDetail();
}
function closeDetail() { if (detailSheet) detailSheet.close(); detailSheet = null; }
function detailLine(accountId, role, amount, variant) {
  const account = accountById(accountId); if (!account) return null;
  return { account, role, amount, variant };
}
function detailRowHtml(line, negative) {
  return '<fin-detail-account-row><button type="button" class="irow ' + line.variant + '" aria-label="Ver cuenta ' + esc(line.account.name) + '" data-act="detail-open-account" data-id="' + line.account.id + '">' +
    accountIconOf(line.account, line.variant === 'main' ? 'md' : 'sm', line.variant === 'off') + '<span class="dpick-t"><b>' + esc(line.account.name) + '</b><small>' + esc(line.role) + '</small></span>' +
    '<span class="dt-amt">' + (negative ? '−' : '') + esc(formatMoney(line.amount)) + '</span>' + finIcon('chevron-right', 'chev') + '</button></fin-detail-account-row>';
}
function renderDetail() {
  if (!detailSheet) return;
  const transfer = getTransfer(detailId), t = transfer.find(x => x.id === detailId);
  if (!t) { closeDetail(); return; }
  const isAdditional = t.parentTransactionId !== null, parent = isAdditional ? transfer[0] : null, kids = isAdditional ? [] : transfer.slice(1), head = parent || t;
  const cancelled = t.status === 'CANCELLED', pending = t.status === 'PENDING';
  /* Lo que sale del origen: lo mostrado más sus adicionales vivas (todas, si está cancelada) */
  const liveKids = cancelled ? kids : kids.filter(k => k.status !== 'CANCELLED');
  const total = t.amount + liveKids.reduce((n, k) => n + k.amount, 0);
  const source = detailLine(t.sourceAccountId, 'Origen', total, 'main');
  const destinations = [detailLine(t.destinationAccountId, isAdditional ? 'Adicional' : 'Destino', t.amount, isAdditional ? 'additional' : 'main')].concat(
    kids.map(k => k.status === 'CANCELLED' ? detailLine(k.destinationAccountId, 'Adicional · cancelada', k.amount, 'off') : detailLine(k.destinationAccountId, 'Adicional', k.amount, 'additional'))).filter(Boolean);
  const parentDestination = parent ? accountById(parent.destinationAccountId) : null;
  /* DIS-10 (iOS 27): la fecha va en la etiqueta de estado («Pendiente · 6 nov»); abajo quedan solo los datos de registro */
  const ios = isIos27();
  const info = ios ? [] : [{ icon: 'calendar', label: pending ? 'Fecha estimada' : 'Fecha', value: dateLong(parseIsoDate(t.estimatedCompletionDate)) }];
  if (pending) info.push({ icon: 'circle-clock', label: 'Completar automáticamente', value: t.autoComplete ? 'Sí' : 'No' });
  if (head.updatedAt) info.push({ icon: 'edit', label: 'Editada', value: dateTime(head.updatedAt) });
  info.push({ icon: ios ? 'calendar' : 'plus', label: 'Creada', value: dateTime(t.createdAt) });   /* DIS-10: el «+» se confundía con «agregar» */
  if (t.completedAt && !ios) info.push({ icon: 'circle-check', label: 'Completada', value: dateTime(t.completedAt) });
  if (t.cancelledAt && !ios) info.push({ icon: 'circle-x', label: 'Cancelada', value: dateTime(t.cancelledAt) });
  /* Editar: pendientes y completadas (desde una adicional se edita su principal). Cancelar: solo desde la principal */
  const acts = [];
  if (t.status !== 'CANCELLED' && head.status !== 'CANCELLED') acts.push(finActionRow('edit', 'Editar transferencia', false, 'detail-edit'));
  const canComplete = pending && !t.autoComplete;
  if (canComplete && !ios) acts.push(finActionRow('circle-check', 'Completar ahora', false, 'detail-complete'));
  if (t.status !== 'CANCELLED' && t.parentTransactionId === null) acts.push(finActionRow('circle-x', 'Cancelar transferencia', true, 'detail-cancel'));
  const hint = !detailError && isAdditional && !cancelled ? 'Las adicionales se cancelan junto con su transacción principal.' : '';
  /* V2-005: los conceptos del desglose van bajo el destino principal, en la misma tarjeta y de solo lectura */
  const concepts = !isAdditional && t.breakdown ? t.breakdown.map(i => '<fin-concept-row' + (cancelled ? ' class="off"' : '') + '><div class="cr"><span class="cr-name">' + esc(i.concept) + '</span><span class="cr-amt">' + esc(formatMoney(i.amount)) + '</span></div></fin-concept-row>').join('') : '';
  /* DIS-10: «Completada · 30 oct 2026», «Pendiente · 6 nov 2026 · automática», «Cancelada · 2 nov 2026» */
  const statusDate = dateLong(t.cancelledAt ? t.cancelledAt : parseIsoDate(t.estimatedCompletionDate));
  const badge = ios ? '<fin-status-badge><span class="d-st ' + t.status.toLowerCase() + '">' + STATUS_NAME[t.status] + ' · ' + esc(statusDate) + (pending && t.autoComplete ? ' · automática' : '') + '</span></fin-status-badge>'
    : finStatusBadge(t.status, t.autoComplete);
  /* DIS-10: en una pendiente, «Completar ahora» es el botón principal bajo el monto */
  const cta = ios && canComplete ? '<fin-primary-button><button type="button" class="dt-cta" data-act="detail-complete">' + finIcon('circle-check') + 'Completar ahora</button></fin-primary-button>' : '';
  detailSheet.body.innerHTML = '<fin-transfer-detail><div class="dt-top">' + finAmountDisplay(total, cancelled) + badge + (head.description ? '<p class="dt-desc">' + esc(head.description) + '</p>' : '') + cta + '</div>' +
    (source ? finListGroup(detailRowHtml(source, true), '', 'dt-from') : '') +   /* V2-005: sin flecha */
    finListGroup((parentDestination ? finInfoRow('receive', 'Adicional de', parentDestination.name) : '') + destinations.map((l, i) => detailRowHtml(l, false) + (i === 0 ? concepts : '')).join(''), '', 'dt-to') +
    finListGroup(info.map(l => finInfoRow(l.icon, l.label, l.value)).join('')) + (acts.length ? finListGroup(acts.join('')) : '') + finHint(hint) + finFormError(detailError) + '</fin-transfer-detail>';
}
/* Ir a la página de la cuenta: cierra el detalle y la abre. */
actions['detail-open-account'] = el => { closeDetail(); navigate('account', el.dataset.id); };
/* Editar cierra el detalle y abre la hoja con los datos de la transferencia. */
actions['detail-edit'] = () => {
  const t = db.transactions.find(x => x.id === detailId), parentId = t.parentTransactionId || t.id;
  closeDetail(); setTimeout(() => openEditSheet(parentId), SHEET_HANDOFF_MS);
};
/* Confirmaciones: el título, el mensaje y los botones son los de la app. */
actions['detail-complete'] = () => {
  const t = db.transactions.find(x => x.id === detailId), name = id => { const a = accountById(id); return a ? a.name : ''; };
  detailError = null;
  showAlert({ title: '¿Completar transferencia?', message: 'Se moverán ' + formatMoney(t.amount) + ' de ' + name(t.sourceAccountId) + ' a ' + name(t.destinationAccountId) + ' con fecha de hoy.',
    confirmLabel: 'Completar', cancelLabel: 'Cancelar', onConfirm: () => runDetailAction(() => completeOne(t.id), COMPLETE_ERROR) });
};
actions['detail-cancel'] = () => {
  const t = db.transactions.find(x => x.id === detailId), count = getTransfer(detailId).slice(1).filter(a => a.status !== 'CANCELLED').length;
  const additionals = count === 0 ? '' : count === 1 ? 'También se cancelará su adicional. ' : 'También se cancelarán sus ' + count + ' adicionales. ';
  detailError = null;
  showAlert({ title: '¿Cancelar transferencia?', message: additionals + (t.status === 'COMPLETED' ? 'Los saldos volverán a como estaban antes.' : 'Esta acción no se puede deshacer.'),
    confirmLabel: 'Sí, cancelar', cancelLabel: 'No', destructive: true, onConfirm: () => runDetailAction(() => cancelTransfer(t.id), CANCEL_ERROR) });
};
/* Completar o cancelar: si el servicio rechaza, el mensaje queda en el detalle; si no, el detalle se cierra. */
function runDetailAction(action, fallback) {
  detailError = null;
  try { action(); closeDetail(); refresh(); }
  catch (err) { detailError = errorMessage(err, fallback); renderDetail(); }
}

/* ---- 5.13 Transacciones recurrentes (V2-008) ----
   Configuración › Transacciones recurrentes lista las cuentas que pueden ser origen, agrupadas por tipo; en cada una se programan sus
   recurrentes. El formulario es el de la transferencia (5.12) con F.recurring: sin saldos y con la repetición en lugar
   de la fecha. «Personalizado» abre un paso dentro de la misma hoja, como el selector de cuentas. */
const REPEAT_OPTIONS = [
  { value: 'DAILY', label: 'Cada día' }, { value: 'WEEKLY', label: 'Cada semana' }, { value: 'BIWEEKLY', label: 'Cada 2 semanas' },
  { value: 'MONTHLY', label: 'Cada mes' }, { value: 'YEARLY', label: 'Cada año' }, { value: 'CUSTOM', label: 'Personalizado' }];
const END_OPTIONS = [{ value: 'NEVER', label: 'Nunca' }, { value: 'DATE', label: 'En una fecha' }];
const FREQ_OPTIONS = [{ value: 'DAILY', label: 'Diariamente' }, { value: 'WEEKLY', label: 'Semanalmente' }, { value: 'MONTHLY', label: 'Mensualmente' }, { value: 'YEARLY', label: 'Anualmente' }];
const WEEKDAY_LETTERS = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];
const UPCOMING_COUNT = 3;
const SELECT_MENU = { style: '--menu-top:48px; --menu-right:12px' };
const recurringCountText = n => n === 0 ? 'Ninguna' : n + (n === 1 ? ' recurrente' : ' recurrentes');
const canSend = account => { const type = typeById(account.accountTypeId); return !!type && type.direction !== 'DESTINATION_ONLY'; };
const repeatShortText = repeat => { const t = ruleText(repeat.rule); return t.charAt(0).toUpperCase() + t.slice(1); };
/* «Próxima: 27 nov 2026», «Inactiva», «Terminada» o «Detenida: motivo» */
function occurrenceText(item) {
  const pending = isPendingTransfer(item.transferId), date = item.occurrenceDate ? dateLong(parseIsoDate(item.occurrenceDate)) : '';
  if (!item.active) return pending ? 'Inactiva · Pendiente: ' + date : 'Inactiva';
  if (item.finished) return 'Terminada';
  if (item.error) return 'Detenida: ' + item.error;
  return 'Próxima: ' + date;
}
/* «Se repite cada mes, el 3. Próximas: hoy, 3 dic 2026 y 3 ene 2027.» */
function repeatHint(repeat) {
  const next = upcomingDates(repeat, UPCOMING_COUNT).map(d => toIsoDate(d) === toIsoDate(today()) ? 'hoy' : dateLong(d));
  return 'Se repite ' + ruleText(repeat.rule) + '. ' + (next.length ? (next.length === 1 ? 'Única: ' : 'Próximas: ') + joinWords(next) + '.' : 'No hay fechas antes del fin.');
}

/* -- Lista de cuentas (fin-recurring-page): las que pueden ser origen (no las de tipo «Solo destino»), agrupadas por tipo
   en el orden de los tipos; un tipo sin cuentas no se muestra -- */
PAGES.recurring = () => {
  const groups = typesBySort().filter(type => type.direction !== 'DESTINATION_ONLY').map(type => {
    const accounts = accountsByName().filter(a => a.accountTypeId === type.id);
    if (!accounts.length) return '';
    return finSectionTitle(type.name) + finListGroup(accounts.map(a => {
      const inactive = a.status === 'INACTIVE';
      return finListItemRow(finAvatar(a), a.name, inactive ? 'Inactiva' : '', recurringCountText(recurringOf(a.id).length), inactive, 'open-recurring-account', 'data-id="' + a.id + '"');
    }).join(''));
  });
  return '<fin-recurring-page>' + finTopBar('Configuración', 'Volver a configuración', '') + '<h1>Transacciones recurrentes</h1>' +
    '<p>Elige una cuenta para programar sus transacciones recurrentes.</p>' + groups.join('') + '</fin-recurring-page>';
};
actions['open-recurring-account'] = el => navigate('recurringAccount', el.dataset.id);

/* -- Recurrentes de una cuenta (fin-recurring-account-page): el título es el destino principal («A …») -- */
PAGES.recurringAccount = () => {
  const account = accountById(route.id);
  if (!account || !canSend(account)) { setTimeout(() => navigate('recurring'), 0); return ''; }   /* si no existe o no puede enviar, vuelve a la lista */
  const items = recurringOf(account.id).map(r => {
    const main = accountById(r.lines[0].accountId);
    return finListItemRow(accountIconOf(main), 'A ' + main.name, occurrenceText(r) + ' · ' + repeatShortText(r.repeat), formatMoney(r.lines.reduce((n, l) => n + l.amount, 0)),
      r.finished || !r.active, 'edit-recurring', 'data-id="' + r.id + '"');
  });
  return '<fin-recurring-account-page>' + finTopBar('Recurrentes', 'Volver a transacciones recurrentes', finIconButton('plus', 'Nueva transacción recurrente', 'new-recurring')) +
    '<h1>' + esc(account.name) + '</h1><p>Transacciones que se repiten en esta cuenta.</p>' +
    finListGroup(items.length ? items.join('') : finEmptyState('Esta cuenta aún no tiene transacciones recurrentes.')) + '</fin-recurring-account-page>';
};
actions['new-recurring'] = () => openRecurringForm(null);
actions['edit-recurring'] = el => openRecurringForm(findRecurring(el.dataset.id));

/* -- Formulario: la cuenta abierta va fija como origen -- */
function openRecurringForm(item) {
  openTransferSheet(route.id);
  Object.assign(F, { recurring: true, recurringId: null, active: true, customRule: null,
    repeat: { preset: 'MONTHLY', rule: presetRule('MONTHLY'), end: 'NEVER', endDate: toIsoDate(addMonths(today(), 12)) } });
  if (item) {
    Object.assign(F, { recurringId: item.id, active: item.active, description: item.description, autoComplete: item.autoComplete,
      rows: item.lines.map(l => newRow(l.accountId, l.amount)),
      breakdown: item.breakdown ? item.breakdown.map(c => newConcept(c.concept, c.amount)) : null,
      breakdownDescription: item.breakdown ? conceptsText(item.breakdown) : '',
      repeat: { preset: item.repeat.preset, rule: copyRule(item.repeat.rule), end: item.repeat.end, endDate: item.repeat.endDate } });
  }

}
function recurringFormTitles() {
  const editing = F.recurringId !== null;

    subtitle: editing ? occurrenceText(findRecurring(F.recurringId)) : 'Define el destino, el valor y la repetición' };
}
/* Repetir, Terminar repetición, (Fecha de fin), Completar automáticamente; al editar, también Activa y Eliminar */
function recurrenceGroupHtml() {
  const r = F.repeat;
  return finListGroup(finSelectRow('repeat', 'Repetir', optionLabel(REPEAT_OPTIONS, r.preset), 'rec-repeat', SELECT_MENU) +
      finSelectRow('repeat-end', 'Terminar repetición', optionLabel(END_OPTIONS, r.end), 'rec-end', SELECT_MENU) +
      (r.end === 'DATE' ? finInputRow('calendar', 'Fecha de fin', 'date', r.endDate, '', 'recEndDate') : '') +
      finSwitchRow('circle-clock', 'Completar automáticamente', F.autoComplete, 'autoComplete')) +
    finHint(F.active ? repeatHint(r) : 'Inactiva: la transferencia pendiente se mantiene, pero no se crearán las siguientes.') +
    (F.recurringId ? finListGroup(finSwitchRow('circle-check', 'Activa', F.active, 'recActive')) +

SELECTS['rec-repeat'] = () => ({ label: 'Repetir', options: REPEAT_OPTIONS, selected: F.repeat.preset, onSelect: v => {
  if (v === 'CUSTOM') { openCustomRepeat(); return; }
  F.repeat.preset = v; F.repeat.rule = presetRule(v); redrawForm();
} });
SELECTS['rec-end'] = () => ({ label: 'Terminar repetición', options: END_OPTIONS, selected: F.repeat.end, onSelect: v => { F.repeat.end = v; redrawForm(); } });
function saveRecurringForm() {
  if (F.step === 'custom') { closeCustomRepeat(true); return; }   /* el ✓ del paso «Personalizado» aplica la regla */
  if (!canSaveForm()) return;
  const data = { sourceAccountId: F.sourceId, description: F.description, autoComplete: F.autoComplete, active: F.active,
    lines: F.rows.map(r => ({ accountId: r.accountId, amount: r.amount })),

    repeat: { preset: F.repeat.preset, rule: copyRule(F.repeat.rule), end: F.repeat.end, endDate: F.repeat.endDate } };
  try { if (F.recurringId) updateRecurring(F.recurringId, data); else createRecurring(data); }
  catch (err) { setFormError(errorMessage(err, SAVE_ERROR)); return; }

actions['delete-recurring'] = () => {
  const id = F.recurringId;

/* -- Paso «Personalizado» (fin-recurrence-custom): la flecha descarta, el ✓ aplica -- */
function openCustomRepeat() {

/* Frecuencia y «Cada»; debajo, según la frecuencia: días de la semana, días del mes («Cada» o «El…») o meses */
function customRepeatHtml() {
  const rule = F.customRule, unit = FREQ_UNITS[rule.freq][rule.interval === 1 ? 0 : 1];
  let panel = '';
  if (rule.freq === 'WEEKLY') panel = gridHtml(WEEK_ORDER.map(d => ({ value: d, label: WEEKDAY_LETTERS[d], aria: WEEKDAY_NAMES[d], on: rule.weekdays.includes(d) })), 'weekdays', '');
  if (rule.freq === 'MONTHLY') {

    panel = '<fin-segmented-control><div class="tabs" role="tablist" aria-label="Días del mes">' + tabs + '</div></fin-segmented-control>' +
      (rule.monthMode === 'EACH'
        ? gridHtml(Array.from({ length: 31 }, (_, i) => ({ value: i + 1, label: String(i + 1), aria: 'Día ' + (i + 1), on: rule.monthDays.includes(i + 1) })), 'monthDays', '')
        /* «El…»: qué semana del mes y qué día (uno de cada) */
        : gridHtml(ORDINALS.map(o => ({ value: o.value, label: o.short, aria: o.label, on: rule.ordinal === o.value })), 'ordinal', 'ordinals') +
          gridHtml(WEEK_ORDER.map(d => ({ value: d, label: WEEKDAY_LETTERS[d], aria: WEEKDAY_NAMES[d], on: rule.weekday === d })), 'weekday', ''));
  }
  if (rule.freq === 'YEARLY') panel = gridHtml(MONTH_NAMES.map((m, i) => ({ value: i, label: MONTHS[i], aria: m, on: rule.months.includes(i) })), 'months', 'months');
  return '<fin-recurrence-custom>' +
    finListGroup(finSelectRow('repeat', 'Frecuencia', optionLabel(FREQ_OPTIONS, rule.freq), 'rec-freq', SELECT_MENU) +
      finSelectRow('circle-clock', 'Cada', rule.interval + ' ' + unit, 'rec-interval', SELECT_MENU)) +
    finHint('Se repite ' + ruleText(rule) + '.') +

/* ==========================================================================================
   DISEÑO iOS 27 · DIS-22: animaciones (solo con iOS 27 y si el sistema no pide reducir el movimiento)
   1. Cambio de pantalla: a una subpantalla de la misma pestaña entra desde la derecha (push); al volver, desde la
      izquierda (pop); al cambiar de pestaña, con un fundido que sube un poco.
   2. Al abrir una pantalla, sus tarjetas y secciones aparecen escalonadas.
   3. Los totales de Inicio y el saldo de una cuenta cuentan hasta su valor.
   4. En el control segmentado, la selección se desliza a la nueva opción.
   5. Al tocar «Ver las N», las filas nuevas aparecen escalonadas.
   (El toque sobre filas y tarjetas está en el CSS.)
   ========================================================================================== */
const animateOn = () => isIos27() && motionOK();
/* Profundidad de cada pantalla dentro de su pestaña: más profunda = subpantalla */
const PAGE_DEPTH = { home: 0, account: 1, transfers: 0, stats: 0, settings: 0, types: 1, accounts: 1, destinations: 1, destination: 2, data: 1, recurring: 1, recurringAccount: 2 };
const STAGGER_SELECTOR = 'fin-list-group, fin-account-section, fin-day-group, fin-breakdown, fin-stats-total, fin-segmented-control, .st-chips, fin-section-title, fin-hint, fin-account-header, .json-card';
const STAGGER_MAX = 12, STAGGER_MS = 35, COUNT_MS = 600;
function animatePage(from, to) {
  const page = $('#outlet') && $('#outlet').firstElementChild;
  if (!page || !animateOn() || from === to) return;
  const sameTab = SECTION_OF[from] === SECTION_OF[to], dFrom = PAGE_DEPTH[from] || 0, dTo = PAGE_DEPTH[to] || 0;
  const kind = sameTab && dTo > dFrom ? 'push' : sameTab && dTo < dFrom ? 'pop' : 'tab';
  page.classList.add('pg-' + kind);
  /* DIS-28: se espera la animación de la propia página (las de sus hijos también llegan aquí); si la página quedara animada,
     Safari en el iPhone deja borrosos los botones de vidrio de la barra */
  const done = e => { if (e.target !== page) return; page.classList.remove('pg-' + kind); page.removeEventListener('animationend', done); };
  page.addEventListener('animationend', done);
  stagger(page, STAGGER_SELECTOR);
  countUp(page);
}
/* Escalona los bloques de primer nivel (no los que están dentro de otro bloque escalonado) */
function stagger(root, selector, startIndex) {
  const blocks = Array.from(root.querySelectorAll(selector)).filter(el => !el.parentElement.closest(selector) || !root.contains(el.parentElement.closest(selector)));
  blocks.slice(0, STAGGER_MAX).forEach((el, i) => {
    el.style.setProperty('--i', (startIndex || 0) + i);
    el.classList.add('stg');
    const done = e => { if (e.target !== el) return; el.classList.remove('stg'); el.removeEventListener('animationend', done); };   /* DIS-28 */
    el.addEventListener('animationend', done);
  });
}
/* Cuenta desde 0 hasta el monto (totales de grupo de Inicio y saldo de una cuenta) */
function countUp(root) {
  root.querySelectorAll('.sec-total, fin-account-header .balance').forEach(el => {
    const text = el.textContent;
    if (text.includes('·')) return;   /* «$… · Inactiva»: se deja como está */
    const target = toCents(text.replace('−', '-').replace(/[^\d,-]/g, '')), t0 = performance.now();
    const step = now => {
      const k = Math.min(1, (now - t0) / COUNT_MS), e = 1 - Math.pow(1 - k, 3);
      el.textContent = formatMoney(Math.round(target * e));
      if (k < 1) requestAnimationFrame(step); else el.textContent = text;
    };
    requestAnimationFrame(step);
  });
}
const navigateWithoutAnimation = navigate;
navigate = (name, id, options) => { const from = route.name; navigateWithoutAnimation(name, id, options); animatePage(from, name); };

/* Control segmentado: una píldora fantasma va de la opción anterior a la nueva y luego se muestra la selección real */
function selectedSegment() {
  const sel = $('#outlet fin-segmented-control .tab[aria-selected="true"]');
  return sel ? { left: sel.offsetLeft, width: sel.offsetWidth } : null;
}
function slideSegment(before) {
  const sel = $('#outlet fin-segmented-control .tab[aria-selected="true"]');
  if (!before || !sel || !animateOn()) return;
  const ghost = document.createElement('span');
  ghost.className = 'seg-ghost';
  Object.assign(ghost.style, { left: before.left + 'px', width: before.width + 'px', top: sel.offsetTop + 'px', height: sel.offsetHeight + 'px' });
  sel.parentElement.appendChild(ghost); sel.classList.add('seg-hidden');
  requestAnimationFrame(() => Object.assign(ghost.style, { left: sel.offsetLeft + 'px', width: sel.offsetWidth + 'px' }));
  ghost.addEventListener('transitionend', () => { ghost.remove(); sel.classList.remove('seg-hidden'); }, { once: true });
}
const transfersStatusWithoutAnimation = actions['transfers-status'];
actions['transfers-status'] = el => {
  const before = selectedSegment();
  transfersStatusWithoutAnimation(el);
  slideSegment(before);
  if (animateOn()) stagger($('#outlet .list'), 'fin-day-group');
};

/* «Ver las N»: las filas que aparecen entran escalonadas */
const statsExpandWithoutAnimation = actions['stats-expand'];
actions['stats-expand'] = el => {
  const key = el.dataset.key, wasExpanded = view.stats.expanded[key];
  statsExpandWithoutAnimation(el);
  if (wasExpanded || !animateOn()) return;
  const button = $('#outlet [data-act="stats-expand"][data-key="' + key + '"]'), rows = button ? button.closest('fin-list-group').querySelectorAll('fin-breakdown-row') : [];
  Array.from(rows).slice(STATS_TOP).forEach((row, i) => { row.style.setProperty('--i', i); row.classList.add('stg'); row.addEventListener('animationend', () => row.classList.remove('stg'), { once: true }); });
};

/* ===== 6. Barra inferior ===== */
/* Barra inferior (fin-tab-bar). Cada pestaña lleva a la raíz de su sección; si ya se está en ella no pasa nada
   (Angular ignora navegar a la misma URL). V2: no hay transiciones de pantalla; solo el rebote del icono. */
const SECTION_ROOT = { home: 'home', transfers: 'transfers', stats: 'stats', settings: 'settings' };
document.addEventListener('click', e => {
  const b = e.target.closest('fin-tab-bar button[data-section]');
  if (!b) return;
  const icon = b.querySelector('fin-icon');
  if (motionOK()) { icon.classList.remove('bounce'); void icon.offsetWidth; icon.classList.add('bounce'); icon.addEventListener('animationend', () => icon.classList.remove('bounce'), { once: true }); }
  const root = SECTION_ROOT[b.dataset.section];
  if (route.name !== root) navigate(root);
});

/* ===== 7. Arranque =====
   Carga DATOS_INICIALES con la misma importación que usa la pantalla Datos (importData) y, como la app al abrir,
   completa las pendientes automáticas cuya fecha ya llegó. */
function arrancar() {
  importData(DATOS_INICIALES);

}
/* Control del mock: cambia la clase ios27 y el tema */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-mock-design], [data-mock-theme]');
  if (!b) return;
  const root = document.documentElement, group = b.parentElement;
  if (b.dataset.mockDesign !== undefined) root.classList.toggle('ios27', b.dataset.mockDesign === 'ios27');
  else if (b.dataset.mockTheme) root.dataset.theme = b.dataset.mockTheme; else delete root.dataset.theme;
  group.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));

/* ===== Datos de prueba de la versión 2 =====
   Transferencias PENDIENTES desde Banco Guayaquil con desglose (V2-001, V2-004 y V2-005), con fechas futuras relativas a
   hoy para que sigan pendientes cada vez que se abre el prototipo. Se crean con createTransfer, así pasan por las mismas
   reglas que una transferencia hecha a mano. Para quitarlas, borra la llamada a agregarDatosDePrueba() en arrancar(). */
const DATOS_DE_PRUEBA = [
  { dias: 3, destino: 'Banco Pacífico', autoComplete: false,
    desglose: [['Préstamo', 2000], ['Junta personal', 3000], ['Adelanto', 5000]], adicional: ['Comisión por transacción', 41] },
  { dias: 7, destino: 'Arriendo', autoComplete: true,
    desglose: [['Arriendo noviembre', 30000], ['Agua', 2500], ['Luz', 2500]] },
  { dias: 15, destino: 'Banco Pacífico', autoComplete: false,
    desglose: [['Ahorro', 5000], ['Fondo de emergencia', 2550]], adicional: ['Comisión por transacción', 41] },
  /* V2-007: ejemplo de un mismo día en Banco Pacífico. El egreso se crea antes que el ingreso: si se proyectara en el orden de
     creación, el saldo pasaría por negativo (279,93 + 100 − 450 = −70,07); con los ingresos primero no (579,93 → 129,93). */
  { dias: 5, origen: 'Banco Pacífico', destino: 'Titanium Visa Signature', autoComplete: false, monto: 45000, descripcion: 'Pago de tarjeta' },
  { dias: 5, destino: 'Banco Pacífico', autoComplete: false, monto: 20000, descripcion: 'Reposición' }
];
function agregarDatosDePrueba() {
  const byName = name => db.accounts.find(a => a.name === name);
  DATOS_DE_PRUEBA.forEach((d, index) => {
    const source = byName(d.origen || 'Banco Guayaquil'), destination = byName(d.destino), date = new Date();
    if (!source || !destination) return;
    date.setDate(date.getDate() + d.dias);
    const amount = d.desglose ? d.desglose.reduce((n, c) => n + c[1], 0) : d.monto;
    const lines = [{ accountId: destination.id, amount: amount }];
    if (d.adicional) lines.push({ accountId: byName(d.adicional[0]).id, amount: d.adicional[1] });
    try {
      /* Cada una se crea un minuto después de la anterior, para que el orden de creación sea claro */
      createTransfer({ id: null, sourceAccountId: source.id, description: d.desglose ? d.desglose.map(c => c[0]).join(', ') : d.descripcion, date: toIsoDate(date), autoComplete: d.autoComplete,
        lines: lines, breakdown: d.desglose ? d.desglose.map(c => ({ concept: c[0], amount: c[1] })) : null }, new Date(Date.now() + index * 60000));
    } catch (err) { console.error('Datos de prueba:', err); }
  });
}
