/* ===== 3. Estado (core/data/libro.db.ts) ===== */
/* Las cuatro tablas del modelo. Los nombres de campos son los de src/app/core/models. */
const db = { accountTypes: [], accounts: [], accountDestinations: [], transactions: [],
  recurringTransactions: [] };   /* V2-008: tabla nueva (todavía no se exporta ni se importa) */

const typeById = id => db.accountTypes.find(t => t.id === id);
const accountById = id => db.accounts.find(a => a.id === id);
const typesBySort = () => db.accountTypes.slice().sort((a, b) => a.sortOrder - b.sortOrder);
/* Dexie orderBy('name'): orden por código de texto (mayúsculas antes que minúsculas). */
const accountsByName = () => db.accounts.slice().sort((a, b) => compareText(a.name, b.name));
const iconOfAccount = a => { const t = typeById(a.accountTypeId); return t ? t.icon : DEFAULT_ICON; };
const typeNameOf = a => { const t = typeById(a.accountTypeId); return t ? t.name : ''; };

/* ===== 4. Servicios (core/services) =====
   V2: las reglas de negocio ya no están repartidas por la interfaz: cada servicio valida, aplica los saldos y lanza
   ValidationError con el mensaje que ve el usuario. La interfaz solo llama a estas funciones y muestra el error. */
class ValidationError extends Error {}
const invalid = message => { throw new ValidationError(message); };
const MAX_NAME_LENGTH = 40;
const MAX_DESCRIPTION_LENGTH = 120;
/* V2-001: desglose del valor del destino principal */
const MAX_CONCEPT_LENGTH = 40;
const BREAKDOWN_ITEM_MESSAGE = 'Cada valor del desglose necesita un concepto y un monto mayor que cero.';

/* ---- 4.1 AccountTypeService ---- */
/* V2: el nombre se limpia (espacios), máx. 40 caracteres y único sin distinguir mayúsculas; el orden es sortOrder 1..n. */
function validateTypeName(name, ownId) {
  if (!name) invalid('Escribe el nombre del tipo de cuenta.');
  if (name.length > MAX_NAME_LENGTH) invalid('El nombre no puede tener más de ' + MAX_NAME_LENGTH + ' caracteres.');
  if (db.accountTypes.some(t => t.id !== ownId && t.name.toLowerCase() === name.toLowerCase())) invalid('Ya existe un tipo con ese nombre.');
}
function createType(type) {
  const name = cleanName(type.name || '');
  validateTypeName(name);
  const last = typesBySort().pop();
  db.accountTypes.push({
    id: newId(), name: name, direction: type.direction || 'BOTH', enabled: type.enabled !== undefined ? type.enabled : true,
    showOnHome: type.showOnHome !== undefined ? type.showOnHome : true, icon: iconOf(type.icon), sortOrder: (last ? last.sortOrder : 0) + 1
  });
}
function updateType(id, changes) {
  const current = typeById(id);
  if (!current) throw new Error('No existe el tipo de cuenta ' + id + '.');
  const c = Object.assign({}, changes); delete c.id; delete c.sortOrder;
  if (c.name !== undefined) { c.name = cleanName(c.name); validateTypeName(c.name, id); }
  if (c.icon !== undefined) c.icon = iconOf(c.icon);
  Object.assign(current, c);
}
/* Reescribe sortOrder 1..n con el orden recibido. */
function reorderTypes(ids) {
  ids.forEach((id, i) => { typeById(id).sortOrder = i + 1; });
}

/* ---- 4.2 AccountService ---- */
/* V2: las cuentas se listan por nombre; validaciones nuevas: nombre máx. 40, tipo habilitado y quitar el saldo negativo solo si es negativo. */
function validateAccountName(name, ownId) {
  if (!name) invalid('Escribe el nombre de la cuenta.');
  if (db.accounts.some(a => a.id !== ownId && a.name.toLowerCase() === name.toLowerCase())) invalid('Ya existe una cuenta con ese nombre.');
  if (name.length > MAX_NAME_LENGTH) invalid('El nombre no puede tener más de ' + MAX_NAME_LENGTH + ' caracteres.');
}
/* El tipo elegido debe existir y estar habilitado. */
function validateAccountType(typeId) {
  const type = typeId ? typeById(typeId) : undefined;
  if (!type) invalid('Selecciona el tipo de cuenta.');
  if (!type.enabled) invalid('El tipo de cuenta está deshabilitado.');
}
function createAccount(account) {
  const name = cleanName(account.name || '');
  validateAccountName(name);
  validateAccountType(account.accountTypeId);
  const initialBalance = account.initialBalance || 0;
  const allowNegativeBalance = account.allowNegativeBalance || false;
  if (initialBalance < 0 && !allowNegativeBalance) invalid('El saldo inicial no puede ser negativo si la cuenta no permite saldo negativo.');
  const isOwn = account.isOwn !== undefined ? account.isOwn : true;
  db.accounts.push({
    id: newId(), accountTypeId: account.accountTypeId, name: name, initialBalance: initialBalance, currentBalance: initialBalance,
    allowNegativeBalance: allowNegativeBalance, status: account.status || 'ACTIVE', isOwn: isOwn,
    isLiquid: isOwn && (account.isLiquid !== undefined ? account.isLiquid : true),
    additionalOnly: account.additionalOnly || false, color: account.color || null
  });
}
function updateAccount(id, changes) {
  const current = accountById(id);
  if (!current) throw new Error('No existe la cuenta ' + id + '.');
  const c = Object.assign({}, changes); delete c.id; delete c.initialBalance; delete c.currentBalance;
  if (c.name !== undefined) { c.name = cleanName(c.name); validateAccountName(c.name, id); }
  /* El tipo puede seguir siendo uno deshabilitado si es el que ya tenía */
  if (c.accountTypeId !== undefined && c.accountTypeId !== current.accountTypeId) validateAccountType(c.accountTypeId);
  if (current.allowNegativeBalance && c.allowNegativeBalance === false && current.currentBalance < 0) invalid('No puedes quitar el saldo negativo mientras la cuenta tenga saldo negativo.');
  if (!(c.isOwn !== undefined ? c.isOwn : current.isOwn)) c.isLiquid = false;
  Object.assign(current, c);
}
/* Cuentas activas de tipos visibles en Inicio con la dirección dada, por nombre. */
function accountsForHome(direction) {
  const ids = new Set(db.accountTypes.filter(t => t.showOnHome && t.direction === direction).map(t => t.id));
  return accountsByName().filter(a => a.status === 'ACTIVE' && ids.has(a.accountTypeId));
}
/* Cuentas activas que pueden ser origen (tipos que no son solo destino), por nombre. */
function sourceAccounts() {
  const ids = new Set(db.accountTypes.filter(t => t.direction !== 'DESTINATION_ONLY').map(t => t.id));
  return accountsByName().filter(a => a.status === 'ACTIVE' && ids.has(a.accountTypeId));
}

/* ---- 4.3 AccountDestinationService ---- */
/* V2: validaciones nuevas (origen/destino válidos, par repetido, monto no negativo, descripción máx. 120). */
const findDestination = (sourceId, destinationId) => db.accountDestinations.find(d => d.sourceAccountId === sourceId && d.destinationAccountId === destinationId);
const destinationsOf = sourceId => db.accountDestinations.filter(d => d.sourceAccountId === sourceId);
/* Cuentas que se ofrecen como destino de un origen: configuradas y habilitadas, activas, de un tipo que no sea solo origen
   y con additionalOnly igual a `additional` (false = destino principal, true = adicional). Por nombre. */
function allowedAccounts(sourceId, additional) {
  const enabled = new Set(destinationsOf(sourceId).filter(d => d.enabled).map(d => d.destinationAccountId));
  const sourceOnly = new Set(db.accountTypes.filter(t => t.direction === 'SOURCE_ONLY').map(t => t.id));
  return accountsByName().filter(a => enabled.has(a.id) && a.status === 'ACTIVE' && !sourceOnly.has(a.accountTypeId) && a.additionalOnly === additional);
}
function validateAmount(amount) { if (amount < 0) invalid('El monto no puede ser negativo.'); }
/* Descripción limpia, o null si queda vacía. */
function cleanDescription(description) {
  const clean = cleanName(description || '');
  if (clean.length > MAX_DESCRIPTION_LENGTH) invalid('La descripción no puede tener más de ' + MAX_DESCRIPTION_LENGTH + ' caracteres.');
  return clean || null;
}
function createDestination(dest) {
  const sourceId = dest.sourceAccountId || '', destinationId = dest.destinationAccountId || '';
  if (!destinationId) invalid('Selecciona la cuenta destino.');
  const defaultAmount = dest.defaultAmount || 0;
  validateAmount(defaultAmount);
  const defaultDescription = cleanDescription(dest.defaultDescription);
  /* El origen debe existir y su tipo no puede ser solo destino */
  const source = accountById(sourceId);
  if (!source) invalid('La cuenta origen no existe.');
  const sourceType = typeById(source.accountTypeId);
  if (sourceType && sourceType.direction === 'DESTINATION_ONLY') invalid('Esa cuenta no puede ser origen: su tipo solo recibe dinero.');
  /* El destino debe ser otra cuenta, existir, estar activa y no ser de un tipo solo origen */
  if (destinationId === sourceId) invalid('El destino debe ser distinto del origen.');
  const destination = accountById(destinationId);
  if (!destination) invalid('La cuenta destino no existe.');
  if (destination.status !== 'ACTIVE') invalid('La cuenta destino está inactiva.');
  const destinationType = typeById(destination.accountTypeId);
  if (destinationType && destinationType.direction === 'SOURCE_ONLY') invalid('Esa cuenta no puede ser destino: su tipo solo envía dinero.');
  if (findDestination(sourceId, destinationId)) invalid('Ese destino ya está configurado para esta cuenta.');
  db.accountDestinations.push({ sourceAccountId: sourceId, destinationAccountId: destinationId, defaultAmount: defaultAmount, defaultDescription: defaultDescription, enabled: dest.enabled !== undefined ? dest.enabled : true });
}
/* Solo cambian el monto, la descripción y «habilitado»; el par origen-destino es fijo. */
function updateDestination(sourceId, destinationId, changes) {
  const current = findDestination(sourceId, destinationId);
  if (!current) throw new Error('No existe el destino ' + destinationId + ' para la cuenta ' + sourceId + '.');
  const allowed = {};
  if (changes.defaultAmount !== undefined) { validateAmount(changes.defaultAmount); allowed.defaultAmount = changes.defaultAmount; }
  if (changes.defaultDescription !== undefined) allowed.defaultDescription = cleanDescription(changes.defaultDescription);
  if (changes.enabled !== undefined) allowed.enabled = changes.enabled;
  Object.assign(current, allowed);
}

/* ---- 4.4 TransactionService ---- */
/* V2: ids UUID (adicionales <principal>-001), fecha como texto ISO (estimatedCompletionDate), orden cronológico propio, saldos
   «después» y proyectados por transacción, y validaciones nuevas de la transferencia (checkDraft). */
const NUMBER_DIGITS = 3;
/* Ids de las adicionales: <principal>-001, -002… El orden de las adicionales es el de su id. */
const additionalId = (parentId, number) => parentId + '-' + String(number).padStart(NUMBER_DIGITS, '0');
const lastAdditionalNumber = (parentId, additionals) => additionals.reduce((last, a) => Math.max(last, Number(a.id.slice(parentId.length + 1))), 0);
const rootIdOf = t => t.parentTransactionId || t.id;
const involves = (t, accountId) => t.sourceAccountId === accountId || t.destinationAccountId === accountId;
/* Lo que la transacción suma (entra) o resta (sale) al saldo de la cuenta. */
const balanceChange = (t, accountId) => t.destinationAccountId === accountId ? t.amount : -t.amount;
const compareIds = (a, b) => a.localeCompare(b, 'en', { numeric: true });
/* Orden cronológico (de la más antigua a la más reciente): fecha, completedAt (o createdAt), createdAt, id de la principal e id. */
function compareChronologically(a, b) {
  return compareText(a.estimatedCompletionDate, b.estimatedCompletionDate)
    || (a.completedAt || a.createdAt).getTime() - (b.completedAt || b.createdAt).getTime()
    || a.createdAt.getTime() - b.createdAt.getTime()
    || compareIds(rootIdOf(a), rootIdOf(b))
    || compareIds(a.id, b.id);
}
/* direction 1: de la más antigua a la más reciente; -1: al revés. */
const sortChronologically = (list, direction) => list.slice().sort((a, b) => direction * compareChronologically(a, b));

/* Todas, la más reciente primero. */
const allTransactions = () => sortChronologically(db.transactions, -1);
/* Las pendientes salen con la más próxima primero; los demás estados, con la más reciente primero. */
const transactionsByStatus = status => sortChronologically(db.transactions.filter(t => t.status === status), status === 'PENDING' ? 1 : -1);
/* La principal y todas sus adicionales (también las canceladas), en orden. Con el id de una adicional devuelve la de su principal. */
function getTransfer(id) {
  const t = db.transactions.find(x => x.id === id);
  if (!t) return [];
  const parentId = rootIdOf(t);
  const parent = db.transactions.find(x => x.id === parentId);
  const additionals = findAdditionals(parentId);
  return parent ? [parent].concat(additionals) : additionals;
}
const findAdditionals = parentId => db.transactions.filter(t => t.parentTransactionId === parentId).sort((a, b) => compareText(a.id, b.id));

/* Saldo de la cuenta después de cada transacción completada: se parte del saldo actual y se retrocede. Clave: id. */
function balancesAfter(accountId) {
  const balances = new Map(), account = accountById(accountId);
  if (!account) return balances;
  let running = account.currentBalance;
  sortChronologically(db.transactions.filter(t => t.status === 'COMPLETED' && involves(t, accountId)), -1).forEach(t => {
    balances.set(t.id, running);
    running -= balanceChange(t, accountId);
  });
  return balances;
}
/* Saldo proyectado de las pendientes: se parte del saldo actual y se avanza en orden de fecha. Clave: id. */
/* V2-007: orden de las pendientes de una cuenta para proyectar su saldo: por fecha y, en un mismo día, primero los ingresos
   (lo que entra a la cuenta) y después los egresos. Así un egreso no deja un saldo negativo de paso si ese mismo día entra
   dinero suficiente. Dentro de los ingresos y de los egresos se respeta el orden cronológico. */
function compareForProjection(a, b, accountId) {
  const outgoing = t => balanceChange(t, accountId) < 0 ? 1 : 0;
  return compareText(a.estimatedCompletionDate, b.estimatedCompletionDate) || outgoing(a) - outgoing(b) || compareChronologically(a, b);
}
function projectedBalances(accountId) {
  const balances = new Map(), account = accountById(accountId);
  if (!account) return balances;
  let running = account.currentBalance;
  db.transactions.filter(t => t.status === 'PENDING' && involves(t, accountId)).sort((a, b) => compareForProjection(a, b, accountId)).forEach(t => {
    running += balanceChange(t, accountId);
    balances.set(t.id, running);
  });
  return balances;
}

/* Primera y última fecha (incluidas, ISO) del período; null en un extremo = sin límite. */
function statsRange(filter, now) {
  const year = now.getFullYear(), month = now.getMonth();
  switch (filter.period) {
    case 'month': return [toIsoDate(new Date(year, month, 1)), toIsoDate(new Date(year, month + 1, 0))];
    case 'prev': return [toIsoDate(new Date(year, month - 1, 1)), toIsoDate(new Date(year, month, 0))];
    case '30': return [toIsoDate(new Date(year, month, now.getDate() - 29)), toIsoDate(now)];
    case 'year': return [toIsoDate(new Date(year, 0, 1)), toIsoDate(new Date(year, 11, 31))];
    case 'custom': {
      const f = filter.from, t = filter.to;
      return f && t && f > t ? [t, f] : [f, t];   /* si vienen al revés se intercambian */
    }
    default: return [null, null];
  }
}
function transactionsForStats(filter, now) {
  const r = statsRange(filter, now || new Date());
  return sortChronologically(db.transactions.filter(t =>
    (filter.status === 'ALL' || t.status === filter.status) &&
    (!filter.sourceId || t.sourceAccountId === filter.sourceId) &&
    (!filter.destinationId || t.destinationAccountId === filter.destinationId) &&
    (r[0] === null || t.estimatedCompletionDate >= r[0]) &&
    (r[1] === null || t.estimatedCompletionDate <= r[1])), -1);
}

/* Cambio de saldo por cuenta: Map(idCuenta → centavos). */
function addMove(changes, fromId, toId, amount) {
  changes.set(fromId, (changes.get(fromId) || 0) - amount);
  changes.set(toId, (changes.get(toId) || 0) + amount);
}
/* Efecto de las transacciones sobre los saldos: 1 las aplica y -1 las devuelve. */
function effectOf(transactions, direction) {
  const changes = new Map();
  transactions.forEach(t => {
    if (direction === 1) addMove(changes, t.sourceAccountId, t.destinationAccountId, t.amount);
    else addMove(changes, t.destinationAccountId, t.sourceAccountId, t.amount);
  });
  return changes;
}
/* Suma los cambios a currentBalance: el único lugar donde cambian los saldos. Con negativeMessage, ninguna cuenta
   sin allowNegativeBalance puede quedar en negativo. */
function applyBalanceChanges(changes, negativeMessage) {
  const updates = [];
  changes.forEach((change, accountId) => {
    const account = getAccount(accountId), balance = account.currentBalance + change;
    if (negativeMessage && balance < 0 && !account.allowNegativeBalance) invalid(negativeMessage(account.name, balance));
    updates.push({ account: account, balance: balance });
  });
  updates.forEach(u => { u.account.currentBalance = u.balance; });
}
function getAccount(id) {
  const a = accountById(id);
  if (!a) throw new Error('No existe la cuenta ' + id + '.');
  return a;
}
const isValidIsoDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && toIsoDate(parseIsoDate(s)) === s;

/* Hoy o pasada → COMPLETED (autoComplete falso); futura → PENDING. doneAt: la fecha con la hora actual. */
function scheduleOf(draft, now) {
  const isDone = draft.date <= toIsoDate(now), p = draft.date.split('-').map(Number);
  return { date: draft.date, isDone: isDone, status: isDone ? 'COMPLETED' : 'PENDING', autoComplete: !isDone && draft.autoComplete,
    doneAt: new Date(p[0], p[1] - 1, p[2], now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds()) };
}
/* Validaciones del formulario y reglas de las secciones 2.3 y 2.4 del modelo. keptDestinationIds: destinos que ya estaban al
   editar; se aceptan aunque su destino permitido se haya deshabilitado. */
function checkDraft(draft, keptDestinationIds) {
  if (!draft.sourceAccountId) invalid('Selecciona la cuenta origen.');
  if (draft.lines.length === 0 || draft.lines.some(l => !l.accountId)) invalid('Selecciona la cuenta destino de cada fila.');
  if (draft.lines.some(l => !Number.isInteger(l.amount) || l.amount <= 0)) invalid('Cada destino debe tener un valor mayor que cero.');
  if (!isValidIsoDate(draft.date)) invalid('Selecciona una fecha válida.');
  const description = cleanName(draft.description);
  if (description.length > MAX_DESCRIPTION_LENGTH) invalid('La descripción no puede tener más de ' + MAX_DESCRIPTION_LENGTH + ' caracteres.');
  const source = getAccount(draft.sourceAccountId);
  const lines = draft.lines.map(l => ({ account: getAccount(l.accountId), amount: l.amount }));
  const sourceType = typeById(source.accountTypeId);
  if (sourceType && sourceType.direction === 'DESTINATION_ONLY') invalid('La cuenta ' + source.name + ' solo puede recibir dinero.');
  const seen = new Set();
  lines.forEach((line, index) => {
    const account = line.account;
    if (account.id === source.id) invalid('El origen no puede ser también destino.');
    if (seen.has(account.id)) invalid('La cuenta ' + account.name + ' está repetida entre los destinos.');
    seen.add(account.id);
    const type = typeById(account.accountTypeId);
    if (type && type.direction === 'SOURCE_ONLY') invalid('La cuenta ' + account.name + ' solo puede enviar dinero.');
    if (index === 0 && account.additionalOnly) invalid('La cuenta ' + account.name + ' solo recibe adicionales y no puede ser el destino principal.');
    if (index > 0 && !account.additionalOnly) invalid('La cuenta ' + account.name + ' no es de solo adicionales y no puede ser una adicional.');
    if (!keptDestinationIds.has(account.id)) {
      const allowed = findDestination(source.id, account.id);
      if (!allowed || !allowed.enabled) invalid(account.name + ' no es un destino permitido para ' + source.name + '.');
    }
  });
  /* V2-001: el desglose solo va en la principal (línea 0) y sus conceptos deben sumar su monto */
  return { source: source, description: description || null, lines: lines, breakdown: checkBreakdown(draft.breakdown, draft.lines[0].amount) };
}
/* V2-001: conceptos del desglose limpios (o null sin desglose). Cada uno con nombre y monto > 0; la suma = monto de la principal. */
function checkBreakdown(items, amount) {
  if (!items || items.length === 0) return null;
  const clean = items.map(i => ({ concept: cleanName(i.concept || ''), amount: i.amount }));
  if (clean.some(i => !i.concept || !Number.isInteger(i.amount) || i.amount <= 0)) invalid(BREAKDOWN_ITEM_MESSAGE);
  if (clean.some(i => i.concept.length > MAX_CONCEPT_LENGTH)) invalid('Cada concepto puede tener hasta ' + MAX_CONCEPT_LENGTH + ' caracteres.');
  if (clean.reduce((n, i) => n + i.amount, 0) !== amount) invalid('La suma del desglose no coincide con el valor del destino principal.');
  return clean;
}
/* Una cuenta inactiva no envía ni recibe. */
function checkActive(transfer) {
  if (transfer.source.status !== 'ACTIVE') invalid('La cuenta ' + transfer.source.name + ' está inactiva y no puede enviar.');
  const inactive = transfer.lines.find(l => l.account.status !== 'ACTIVE');
  if (inactive) invalid('La cuenta ' + inactive.account.name + ' está inactiva y no puede recibir.');
}
/* Saldo del origen suficiente, salvo que permita saldo negativo. */
function checkBalance(source, needed) {
  if (!source.allowNegativeBalance && source.currentBalance - needed < 0)
    invalid('Saldo insuficiente en ' + source.name + '. Disponible ' + formatMoney(Math.max(source.currentBalance, 0)) + ', requiere ' + formatMoney(needed) + '.');
}
/* Campos de una fila que salen del borrador (los comparten crear y editar). La línea 0 es la principal. */
function rowFields(transfer, index, schedule) {
  return { sourceAccountId: transfer.source.id, destinationAccountId: transfer.lines[index].account.id, amount: transfer.lines[index].amount,
    description: index === 0 ? transfer.description : null, status: schedule.status, estimatedCompletionDate: schedule.date, autoComplete: schedule.autoComplete,
    breakdown: index === 0 ? transfer.breakdown : null };   /* V2-001 */
}

/* Crea la transferencia. Devuelve el id de la principal. */
function createTransfer(draft, now) {
  now = now || new Date();
  const transfer = checkDraft(draft, new Set());
  const schedule = scheduleOf(draft, now);
  if (schedule.isDone) {
    checkActive(transfer);
    checkBalance(transfer.source, transfer.lines.reduce((n, l) => n + l.amount, 0));
  }
  const parentId = newId();
  const rows = transfer.lines.map((_, index) => Object.assign(rowFields(transfer, index, schedule), {
    id: index === 0 ? parentId : additionalId(parentId, index), parentTransactionId: index === 0 ? null : parentId,
    createdAt: now, completedAt: schedule.isDone ? schedule.doneAt : null, cancelledAt: null, updatedAt: null }));
  if (schedule.isDone) applyBalanceChanges(effectOf(rows, 1));
  rows.forEach(r => db.transactions.push(r));
  return parentId;
}

/* Edita la transferencia completa. Con el id de una adicional edita su principal. */
function editTransfer(draft, now) {
  now = now || new Date();
  const edited = draft.id ? db.transactions.find(t => t.id === draft.id) : undefined;
  if (!edited) throw new Error('No existe la transacción ' + draft.id + '.');
  const parentId = rootIdOf(edited), parent = db.transactions.find(t => t.id === parentId);
  if (!parent) throw new Error('No existe la transacción ' + parentId + '.');
  if (parent.status === 'CANCELLED') invalid('Una transferencia cancelada no se puede editar.');
  const allAdditionals = findAdditionals(parentId);
  const oldRows = [parent].concat(allAdditionals.filter(a => a.status !== 'CANCELLED'));

  /* Un destino que ya estaba se acepta aunque su destino permitido se haya deshabilitado (si el origen es el mismo) */
  const kept = draft.sourceAccountId === parent.sourceAccountId ? new Set(oldRows.map(r => r.destinationAccountId)) : new Set();
  const transfer = checkDraft(draft, kept);
  const schedule = scheduleOf(draft, now);
  if (schedule.isDone) checkActive(transfer);

  /* Delta: se devuelve lo que estaba completado y se aplica el efecto nuevo si la fecha es hoy o pasada */
  const changes = effectOf(oldRows.filter(r => r.status === 'COMPLETED'), -1);
  if (schedule.isDone) transfer.lines.forEach(l => addMove(changes, transfer.source.id, l.account.id, l.amount));
  applyBalanceChanges(changes, (name, balance) => 'No se puede guardar: ' + name + ' quedaría con saldo negativo (' + formatMoney(balance) + ').');

  /* Se conservan los ids en orden; las adicionales nuevas toman el siguiente número libre y las sobrantes se eliminan */
  let nextNumber = lastAdditionalNumber(parentId, allAdditionals) + 1;
  const rows = transfer.lines.map((_, index) => {
    const old = oldRows[index];
    const id = old ? old.id : additionalId(parentId, nextNumber++);
    const keepsCompletedAt = old && old.status === 'COMPLETED' && old.estimatedCompletionDate === schedule.date && old.completedAt;
    return Object.assign({}, old || { createdAt: now, cancelledAt: null }, rowFields(transfer, index, schedule), {
      id: id, parentTransactionId: index === 0 ? null : parentId,
      completedAt: !schedule.isDone ? null : (keepsCompletedAt || schedule.doneAt), updatedAt: now });
  });
  rows.forEach(r => {
    const i = db.transactions.findIndex(t => t.id === r.id);
    if (i >= 0) db.transactions[i] = r; else db.transactions.push(r);
  });
  oldRows.slice(rows.length).forEach(r => db.transactions.splice(db.transactions.findIndex(t => t.id === r.id), 1));
}

/* Pasa una pendiente a completada con las reglas de cuenta inactiva y saldo, y mueve su monto. */
function completeTransaction(t, date, completedAt) {
  const source = getAccount(t.sourceAccountId), destination = getAccount(t.destinationAccountId);
  checkActive({ source: source, lines: [{ account: destination, amount: t.amount }] });
  checkBalance(source, t.amount);
  applyBalanceChanges(effectOf([t], 1));
  Object.assign(t, { status: 'COMPLETED', estimatedCompletionDate: date, completedAt: completedAt });
}
/* Completa una pendiente sin autoComplete, con fecha de hoy; mueve solo su monto. */
function completeOne(id, now) {
  now = now || new Date();
  const t = db.transactions.find(x => x.id === id);
  if (!t) throw new Error('No existe la transacción ' + id + '.');
  if (t.status !== 'PENDING') invalid('Solo se pueden completar las transacciones pendientes.');
  if (t.autoComplete) invalid('Esta transacción se completa sola en su fecha.');
  completeTransaction(t, toIsoDate(now), now);
}
/* Cancela la transferencia desde su principal y revierte los saldos de lo completado. */
function cancelTransfer(parentId, now) {
  now = now || new Date();
  const parent = db.transactions.find(t => t.id === parentId);
  if (!parent) throw new Error('No existe la transacción ' + parentId + '.');
  if (parent.parentTransactionId !== null) invalid('Solo se puede cancelar desde la transferencia principal.');
  if (parent.status === 'CANCELLED') invalid('La transferencia ya está cancelada.');
  const group = [parent].concat(findAdditionals(parentId).filter(a => a.status !== 'CANCELLED'));
  /* Sin revisar cuentas inactivas: cancelar siempre se permite */
  applyBalanceChanges(effectOf(group.filter(r => r.status === 'COMPLETED'), -1), name => 'No se puede cancelar: la cuenta ' + name + ' quedaría con saldo negativo.');
  group.forEach(r => { r.status = 'CANCELLED'; r.cancelledAt = now; });
}
/* Al abrir: completa las pendientes con autoComplete cuya fecha ya llegó, en orden de fecha, con completedAt = su fecha.
   Una que no pasa las reglas queda pendiente y se sigue con las demás. */
function autoCompleteDue(now) {
  now = now || new Date();
  const today = toIsoDate(now);
  const due = db.transactions.filter(t => t.status === 'PENDING' && t.autoComplete && t.estimatedCompletionDate <= today);
  let count = 0;
  sortChronologically(due, 1).forEach(t => {
    try { completeTransaction(t, t.estimatedCompletionDate, parseIsoDate(t.estimatedCompletionDate)); count++; }
    catch (e) { if (!(e instanceof ValidationError)) throw e; }
  });
  return count;
}

/* ---- 4.5 DataTransferService (formato de la sección 9 del modelo) ---- */
/* V2: la importación revisa muchos más casos (validateImport), asigna ids nuevos a los tipos y renumera las adicionales. */
const EXPORT_VERSION = 2;   /* V2-001: versión 2 = transacciones con «breakdown» (se siguen aceptando archivos de la versión 1) */
const LISTS = ['accountTypes', 'accounts', 'accountDestinations', 'transactions'];
const MONEY_MESSAGE = 'Los montos deben ser números enteros, en centavos.';
const toIsoOrNull = d => d ? d.toISOString() : null;
const toDateOrNull = s => s ? new Date(s) : null;

function exportData(now) {
  const typeNames = new Map(db.accountTypes.map(t => [t.id, t.name]));
  const byKey = (a, b) => compareText(a, b);
  return {
    version: EXPORT_VERSION,
    exportedAt: (now || new Date()).toISOString(),
    accountTypes: typesBySort().map(t => ({ name: t.name, direction: t.direction, enabled: t.enabled, showOnHome: t.showOnHome, icon: t.icon, sortOrder: t.sortOrder })),
    accounts: db.accounts.slice().sort((a, b) => byKey(a.id, b.id)).map(a => ({
      id: a.id, name: a.name, type: typeNames.get(a.accountTypeId), initialBalance: a.initialBalance, currentBalance: a.currentBalance,
      allowNegativeBalance: a.allowNegativeBalance, additionalOnly: a.additionalOnly, isOwn: a.isOwn, isLiquid: a.isLiquid, color: a.color, status: a.status })),
    accountDestinations: db.accountDestinations.slice().sort((a, b) => byKey(a.sourceAccountId + a.destinationAccountId, b.sourceAccountId + b.destinationAccountId)).map(d => ({
      source: d.sourceAccountId, destination: d.destinationAccountId, defaultAmount: d.defaultAmount, defaultDescription: d.defaultDescription, enabled: d.enabled })),
    transactions: db.transactions.slice().sort((a, b) => byKey(a.id, b.id)).map(t => ({
      id: t.id, parentId: t.parentTransactionId, source: t.sourceAccountId, destination: t.destinationAccountId, amount: t.amount, description: t.description,
      status: t.status, estimatedCompletionDate: t.estimatedCompletionDate, autoComplete: t.autoComplete, createdAt: t.createdAt.toISOString(),
      completedAt: toIsoOrNull(t.completedAt), cancelledAt: toIsoOrNull(t.cancelledAt), updatedAt: toIsoOrNull(t.updatedAt),
      breakdown: t.breakdown ? t.breakdown.map(i => ({ concept: i.concept, amount: i.amount })) : null }))
  };
}

const hasText = v => typeof v === 'string' && v.trim() !== '';
const hasId = v => hasText(v) || typeof v === 'number';
const hasRepeatedIds = ids => new Set(ids.map(String)).size < ids.length;
const hasRepeatedNames = names => new Set(names.map(n => n.toLowerCase())).size < names.length;
const isOptionalInteger = v => v == null || Number.isInteger(v);
const isIsoDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && toIsoDate(parseIsoDate(s)) === s;
const isTimestamp = v => typeof v === 'string' && !Number.isNaN(new Date(v).getTime());

/* Revisa el contenido antes de importar. Devuelve el mensaje del primer problema o null si está bien. */
function validateImport(data) {
  const missing = LISTS.filter(n => !Array.isArray(data && data[n]));
  if (missing.length > 0) return 'Falta la lista ' + missing.join(', ') + '.';
  const rows = [].concat(data.accountTypes, data.accounts, data.accountDestinations, data.transactions);
  if (rows.some(r => typeof r !== 'object' || r === null || Array.isArray(r))) return 'Las listas solo pueden contener objetos.';
  const { accountTypes: types, accounts, accountDestinations: destinations, transactions } = data;
  /* tipos */
  if (types.some(t => !hasText(t.name))) return 'Hay tipos de cuenta sin nombre.';
  if (hasRepeatedNames(types.map(t => t.name))) return 'Hay tipos de cuenta con el mismo nombre (sin distinguir mayúsculas).';
  if (types.some(t => t.direction != null && !DIRECTION_NAME[t.direction])) return 'Hay tipos de cuenta con una dirección que no es válida.';
  /* cuentas */
  if (accounts.some(a => !hasId(a.id))) return 'Hay cuentas sin id.';
  if (hasRepeatedIds(accounts.map(a => a.id))) return 'Hay cuentas con el mismo id.';
  if (accounts.some(a => !hasText(a.name))) return 'Hay cuentas sin nombre.';
  if (hasRepeatedNames(accounts.map(a => a.name))) return 'Hay cuentas con el mismo nombre (sin distinguir mayúsculas).';
  const typeNames = new Set(types.map(t => t.name));
  const withoutType = accounts.find(a => !typeNames.has(a.type));
  if (withoutType) return 'La cuenta "' + withoutType.name + '" usa el tipo "' + withoutType.type + '", que no existe en "accountTypes".';
  if (accounts.some(a => a.status != null && ['ACTIVE', 'INACTIVE'].indexOf(a.status) < 0)) return 'Hay cuentas con un estado que no es válido.';
  if (accounts.some(a => !isOptionalInteger(a.initialBalance) || !isOptionalInteger(a.currentBalance))) return MONEY_MESSAGE;
  /* referencias */
  const accountIds = new Set(accounts.map(a => String(a.id)));
  const exists = id => id != null && accountIds.has(String(id));
  const isBroken = r => !exists(r.source) || !exists(r.destination);
  if (transactions.some(isBroken) || destinations.some(isBroken)) return 'Hay referencias a cuentas que no existen en "accounts".';
  /* destinos */
  const pairs = destinations.map(d => d.source + '\n' + d.destination);
  if (new Set(pairs).size < pairs.length) return 'Hay destinos permitidos repetidos.';
  if (destinations.some(d => !isOptionalInteger(d.defaultAmount))) return MONEY_MESSAGE;
  /* transacciones */
  if (transactions.some(t => !hasId(t.id))) return 'Hay transacciones sin id.';
  if (hasRepeatedIds(transactions.map(t => t.id))) return 'Hay transacciones con el mismo id.';
  if (transactions.some(t => ['PENDING', 'COMPLETED', 'CANCELLED'].indexOf(t.status) < 0)) return 'Hay transacciones con un estado que no es válido.';
  if (transactions.some(t => !Number.isInteger(t.amount))) return MONEY_MESSAGE;
  if (transactions.some(t => t.amount <= 0)) return 'Cada transacción debe tener un monto mayor que cero.';
  if (transactions.some(t => !isIsoDate(String(t.estimatedCompletionDate).slice(0, 10)))) return 'Hay transacciones con una fecha estimada que no es válida.';
  const badAudit = transactions.some(t => !isTimestamp(t.createdAt) || [t.completedAt, t.cancelledAt, t.updatedAt].some(d => d != null && !isTimestamp(d)));
  if (badAudit) return 'Hay transacciones con fechas de creación, completado, cancelación o edición que no son válidas.';
  const mainIds = new Set(transactions.filter(t => t.parentId == null).map(t => String(t.id)));
  if (transactions.some(t => t.parentId != null && !mainIds.has(String(t.parentId)))) return 'Hay adicionales cuya principal no existe en "transactions" o no es una transacción principal.';
  /* V2-001: desglose opcional, solo en las principales y con conceptos que suman el monto */
  const badBreakdown = t => t.breakdown != null && (t.parentId != null || !Array.isArray(t.breakdown) || t.breakdown.length === 0 ||
    t.breakdown.some(i => !i || !hasText(i.concept) || !Number.isInteger(i.amount) || i.amount <= 0) || t.breakdown.reduce((n, i) => n + i.amount, 0) !== t.amount);
  if (transactions.some(badBreakdown)) return 'Hay desgloses que no son válidos: solo van en la transacción principal y sus conceptos deben sumar su monto.';
  return null;
}

/* Ordena las adicionales por id numérico (ids del prototipo v1) o, si no son números, por texto. */
function compareImportedIds(a, b) {
  const na = Number(a.id), nb = Number(b.id);
  if (Number.isFinite(na) && Number.isFinite(nb)) return na - nb;
  return compareText(String(a.id), String(b.id));
}
/* Reemplaza todos los datos por los del archivo. Los tipos reciben un id nuevo y un sortOrder 1..n; las adicionales,
   ids derivados de su principal (<principal>-001). Si algo falla, los datos de antes quedan intactos. */
function importData(data) {
  const problem = validateImport(data);
  if (problem) invalid(problem);
  const types = data.accountTypes.slice().sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0)).map((t, index) => ({
    id: newId(), name: t.name, direction: t.direction || 'BOTH', enabled: t.enabled !== false, showOnHome: t.showOnHome !== false,
    icon: iconOf(t.icon), sortOrder: index + 1 }));
  const typeIds = new Map(types.map(t => [t.name, t.id]));
  const accounts = data.accounts.map(a => ({
    id: String(a.id), accountTypeId: typeIds.get(a.type), name: a.name, initialBalance: a.initialBalance || 0,
    currentBalance: a.currentBalance != null ? a.currentBalance : (a.initialBalance || 0), allowNegativeBalance: !!a.allowNegativeBalance,
    status: a.status === 'INACTIVE' ? 'INACTIVE' : 'ACTIVE', isOwn: a.isOwn !== false,
    isLiquid: a.isOwn !== false && a.isLiquid !== false, additionalOnly: !!a.additionalOnly, color: a.color || null }));
  const destinations = data.accountDestinations.map(d => ({
    sourceAccountId: String(d.source), destinationAccountId: String(d.destination), defaultAmount: d.defaultAmount || 0,
    defaultDescription: d.defaultDescription || null, enabled: d.enabled !== false }));
  /* Las principales conservan su id; las adicionales toman <principal>-001, -002… según su posición */
  const newIds = new Map(), byParent = new Map();
  data.transactions.forEach(row => {
    if (row.parentId == null) newIds.set(String(row.id), String(row.id));
    else byParent.set(String(row.parentId), (byParent.get(String(row.parentId)) || []).concat(row));
  });
  byParent.forEach((list, parentId) => list.sort(compareImportedIds).forEach((row, i) => newIds.set(String(row.id), additionalId(parentId, i + 1))));
  const transactions = data.transactions.map(row => ({
    id: newIds.get(String(row.id)), parentTransactionId: row.parentId == null ? null : String(row.parentId), sourceAccountId: String(row.source),
    destinationAccountId: String(row.destination), amount: row.amount, description: row.description || null, status: row.status,
    estimatedCompletionDate: String(row.estimatedCompletionDate).slice(0, 10), autoComplete: !!row.autoComplete, createdAt: new Date(row.createdAt),
    completedAt: toDateOrNull(row.completedAt), cancelledAt: toDateOrNull(row.cancelledAt), updatedAt: toDateOrNull(row.updatedAt),
    breakdown: Array.isArray(row.breakdown) && row.breakdown.length > 0 ? row.breakdown.map(i => ({ concept: cleanName(i.concept), amount: i.amount })) : null }));
  db.accountTypes = types; db.accounts = accounts; db.accountDestinations = destinations; db.transactions = transactions;
  db.recurringTransactions = [];   /* V2-008: las recurrentes apuntan a cuentas que ya no existen */
}

/* ---- V2-008 · Transacciones recurrentes (servicio) ----
   Una recurrente guarda lo mismo que una transferencia (origen, destinos con montos, descripción, desglose y
   «Completar automáticamente») más su repetición. Sus transferencias se crean DE UNA EN UNA: al guardarla se crea solo
   la primera; cuando esa se completa o se cancela, se crea la siguiente fecha de la serie, y así sucesivamente.
   Cada una se crea PENDIENTE aunque su fecha sea hoy o ya haya pasado. Desactivarla solo impide crear la siguiente.
   Regla de repetición: { freq: DAILY|WEEKLY|MONTHLY|YEARLY, interval, weekdays (0 = domingo), monthMode: EACH|ON,
   monthDays, ordinal ('1'..'4', '-1' = último), weekday, months (0 = enero), day }.
   Recurrente: { id, sourceAccountId, description, autoComplete, lines: [{ accountId, amount }], breakdown, active,
   repeat: { preset, rule, end: NEVER|DATE, endDate, startDate }, occurrenceDate, transferId, finished, error } */
const WEEKDAY_NAMES = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const WEEK_ORDER = [1, 2, 3, 4, 5, 6, 0];   /* la semana empieza el lunes */
const MONTH_NAMES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const ORDINALS = [{ value: '1', label: 'primer', short: '1.º' }, { value: '2', label: 'segundo', short: '2.º' }, { value: '3', label: 'tercer', short: '3.º' }, { value: '4', label: 'cuarto', short: '4.º' }, { value: '-1', label: 'último', short: 'Últ.' }];
const FREQ_UNITS = { DAILY: ['día', 'días'], WEEKLY: ['semana', 'semanas'], MONTHLY: ['mes', 'meses'], YEARLY: ['año', 'años'] };
const MAX_INTERVAL = 12;
const MAX_ADVANCE_STEPS = 50;

const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const daysInMonth = (year, month) => new Date(year, month + 1, 0).getDate();
const addMonths = (d, n) => { const m = new Date(d.getFullYear(), d.getMonth() + n, 1); m.setDate(Math.min(d.getDate(), daysInMonth(m.getFullYear(), m.getMonth()))); return m; };
const optionLabel = (options, value) => (options.find(o => o.value === value) || options[0]).label;
const joinWords = list => list.length < 2 ? list.join('') : list.slice(0, -1).join(', ') + ' y ' + list[list.length - 1];
const copyRule = rule => JSON.parse(JSON.stringify(rule));
const findRecurring = id => db.recurringTransactions.find(r => r.id === id);
/* Las recurrentes de una cuenta son las que salen de ella (es su origen) */
const recurringOf = accountId => db.recurringTransactions.filter(r => r.sourceAccountId === accountId);
const isPendingTransfer = id => !!id && (getTransfer(id)[0] || {}).status === 'PENDING';

/* Las opciones comunes de «Repetir» son reglas armadas a partir de hoy */
function presetRule(preset) {
  const d = today();
  const base = { interval: 1, weekdays: [d.getDay()], monthMode: 'EACH', monthDays: [d.getDate()], ordinal: '1', weekday: d.getDay(), months: [d.getMonth()], day: d.getDate() };
  if (preset === 'DAILY') return Object.assign(base, { freq: 'DAILY' });
  if (preset === 'WEEKLY') return Object.assign(base, { freq: 'WEEKLY' });
  if (preset === 'BIWEEKLY') return Object.assign(base, { freq: 'WEEKLY', interval: 2 });
  if (preset === 'YEARLY') return Object.assign(base, { freq: 'YEARLY' });
  return Object.assign(base, { freq: 'MONTHLY' });
}
/* «cada mes, el 15» */
function ruleText(rule) {
  const unit = FREQ_UNITS[rule.freq];
  const every = rule.interval === 1 ? (rule.freq === 'WEEKLY' ? 'cada semana' : 'cada ' + unit[0]) : 'cada ' + rule.interval + ' ' + unit[1];
  let detail = '';
  if (rule.freq === 'WEEKLY') detail = 'el ' + joinWords(WEEK_ORDER.filter(d => rule.weekdays.includes(d)).map(d => WEEKDAY_NAMES[d]));
  if (rule.freq === 'MONTHLY') {
    const days = rule.monthDays.slice().sort((a, b) => a - b);
    detail = rule.monthMode === 'ON' ? 'el ' + optionLabel(ORDINALS, rule.ordinal) + ' ' + WEEKDAY_NAMES[rule.weekday]
      : (days.length === 1 ? 'el ' : 'los días ') + joinWords(days.map(String));
  }
  if (rule.freq === 'YEARLY') detail = 'el ' + rule.day + ' de ' + joinWords(rule.months.slice().sort((a, b) => a - b).map(m => MONTH_NAMES[m]));
  return every + (detail ? ', ' + detail : '');
}
/* ¿La regla cae en el día d? start es el inicio de la serie (marca qué semanas, meses o años tocan). */
function ruleMatches(rule, start, d) {
  const days = Math.round((d - start) / 86400000);
  if (rule.freq === 'DAILY') return days % rule.interval === 0;
  if (rule.freq === 'WEEKLY') {
    const monday = x => addDays(x, -((x.getDay() + 6) % 7));
    const weeks = Math.round((monday(d) - monday(start)) / (7 * 86400000));
    return weeks % rule.interval === 0 && rule.weekdays.includes(d.getDay());
  }
  const months = (d.getFullYear() - start.getFullYear()) * 12 + d.getMonth() - start.getMonth();
  const lastDay = daysInMonth(d.getFullYear(), d.getMonth());
  if (rule.freq === 'MONTHLY') {
    if (months % rule.interval !== 0) return false;
    if (rule.monthMode === 'EACH') return rule.monthDays.some(n => Math.min(n, lastDay) === d.getDate());   /* el 31 cae el último día en meses cortos */
    if (d.getDay() !== rule.weekday) return false;
    return rule.ordinal === '-1' ? d.getDate() + 7 > lastDay : Math.ceil(d.getDate() / 7) === Number(rule.ordinal);
  }
  return (d.getFullYear() - start.getFullYear()) % rule.interval === 0 && rule.months.includes(d.getMonth()) && d.getDate() === Math.min(rule.day, lastDay);
}
/* Fechas de la serie desde `from` (incluida), sin pasar la fecha de fin. La serie empieza en repeat.startDate (hoy si aún no se guardó). */
function upcomingDates(repeat, count, from) {
  const start = repeat.startDate ? parseIsoDate(repeat.startDate) : today();
  from = from || start;
  const limit = addDays(from, 366 * MAX_INTERVAL), dates = [];
  const end = repeat.end === 'DATE' ? parseIsoDate(repeat.endDate) : null;
  for (let d = from; d <= limit && dates.length < count && (!end || d <= end); d = addDays(d, 1)) if (ruleMatches(repeat.rule, start, d)) dates.push(d);
  return dates;
}
const pendingDraft = (item, id, date) => ({ id: id, sourceAccountId: item.sourceAccountId, description: item.description, date: date, autoComplete: item.autoComplete,
  lines: item.lines.map(l => ({ accountId: l.accountId, amount: l.amount })), breakdown: item.breakdown ? item.breakdown.map(c => ({ concept: c.concept, amount: c.amount })) : null });
/* createTransfer/editTransfer dejan pendiente lo que tiene fecha futura: se les pasa «ahora» como el día anterior a la
   fecha y luego se corrigen createdAt/updatedAt con la hora real. Devuelve el id de la principal. */
function savePending(draft) {
  const now = new Date(), dayBefore = addDays(parseIsoDate(draft.date), -1);
  dayBefore.setHours(now.getHours(), now.getMinutes(), now.getSeconds());
  const id = draft.id ? (editTransfer(draft, dayBefore), draft.id) : createTransfer(draft, dayBefore);
  getTransfer(id).forEach(t => { if (t.createdAt === dayBefore) t.createdAt = now; if (draft.id) t.updatedAt = now; });
  return id;
}
/* Crea la transferencia de la siguiente fecha de la serie; sin más fechas, la recurrente queda terminada */
function createNextOccurrence(item) {
  const from = item.occurrenceDate ? addDays(parseIsoDate(item.occurrenceDate), 1) : today();
  const next = upcomingDates(item.repeat, 1, from)[0];
  if (!next) { item.finished = true; item.transferId = null; return; }
  const date = toIsoDate(next);
  item.transferId = savePending(pendingDraft(item, null, date));
  item.occurrenceDate = date;
}
/* data: { sourceAccountId, description, autoComplete, lines, breakdown, repeat, active }. Si la primera transferencia no
   pasa las reglas de una transferencia, no se guarda nada. */
function createRecurring(data) {
  const item = Object.assign({ id: newId(), occurrenceDate: null, transferId: null, finished: false, error: null }, data,
    { description: cleanName(data.description), repeat: Object.assign(copyRule(data.repeat), { startDate: toIsoDate(today()) }) });
  createNextOccurrence(item);
  db.recurringTransactions.push(item);
  return item.id;
}
/* Editar cambia la recurrente y su transferencia pendiente (las completadas no se tocan). Si cambia la regla, la serie
   vuelve a empezar hoy y la pendiente pasa a la primera fecha de la serie nueva; si la serie nueva no tiene fechas, la
   pendiente se cancela y la recurrente queda terminada. Sin pendiente (terminada, detenida o inactiva), al guardar
   activa la serie sigue desde hoy, sin repetir la fecha que ya tuvo transferencia. */
function updateRecurring(id, data) {
  const item = findRecurring(id);
  if (!item) throw new Error('No existe la transacción recurrente ' + id + '.');
  const sameRule = JSON.stringify(item.repeat.rule) === JSON.stringify(data.repeat.rule);
  const repeat = Object.assign(copyRule(data.repeat), { startDate: sameRule ? item.repeat.startDate : toIsoDate(today()) });
  const updated = Object.assign({}, item, data, { description: cleanName(data.description), repeat: repeat, error: null });
  const snapshot = Object.assign({}, item);
  if (isPendingTransfer(item.transferId)) {
    const next = upcomingDates(repeat, 1, sameRule ? parseIsoDate(item.occurrenceDate) : today())[0];
    if (next) savePending(pendingDraft(updated, item.transferId, toIsoDate(next))); else cancelTransfer(item.transferId);
    Object.assign(item, updated, next ? { occurrenceDate: toIsoDate(next), finished: false } : { transferId: null, finished: true });
    return;
  }
  const yesterday = toIsoDate(addDays(today(), -1)), last = item.occurrenceDate;
  Object.assign(item, updated, { finished: false, transferId: null, occurrenceDate: last && last > yesterday ? last : yesterday });
  if (!item.active) return;
  try { createNextOccurrence(item); }
  catch (err) { Object.assign(item, snapshot); throw err; }   /* si no se puede crear, la recurrente queda como estaba */
}
/* Eliminar cancela su transferencia pendiente; las completadas no cambian */
function deleteRecurring(id) {
  const item = findRecurring(id);
  if (!item) return;
  if (isPendingTransfer(item.transferId)) cancelTransfer(item.transferId);
  db.recurringTransactions.splice(db.recurringTransactions.indexOf(item), 1);
}
/* Si la transferencia de una recurrente activa ya no está pendiente, crea la siguiente. Las automáticas cuya fecha ya
   llegó se completan aquí (como al abrir la app), así que la serie puede avanzar varias veces. Si la siguiente no
   pasa las reglas (p. ej. una cuenta inactiva), la recurrente queda detenida con el motivo. */
function advanceRecurring() {
  if (!db.recurringTransactions.length) return;   /* sin recurrentes, todo sigue como antes */
  for (let step = 0; step < MAX_ADVANCE_STEPS; step++) {
    autoCompleteDue();
    const done = db.recurringTransactions.filter(r => r.active && !r.finished && r.transferId && !isPendingTransfer(r.transferId));
    if (!done.length) return;
    done.forEach(r => { try { createNextOccurrence(r); } catch (err) { if (!(err instanceof ValidationError)) throw err; r.transferId = null; r.error = err.message; } });
  }
}

/* fin-select-row: la fila que abre un menú. data-select lleva el nombre del campo; las opciones se piden al abrir. */

/* ---- 5.8 Página de una cuenta (features/home/pages/fin-account-page) ----
   V2: encabezado compacto con el saldo bajo el nombre, tarjetas en cuadrícula (fin-account-transaction-item), «saldo después» y proyectado

/* Agrupa las transacciones que tocan a la cuenta en transferencias, conservando su orden. Si la cuenta es el origen, las
   adicionales van bajo su principal; si solo es el destino de una adicional, esa adicional se ve sola. */
function groupAccountTransfers(transactions, accountId) {
  const mine = transactions.filter(t => involves(t, accountId)), mineIds = new Set(mine.map(t => t.id));
  const byId = new Map(transactions.map(t => [t.id, t])), additionalsOf = new Map();
  mine.forEach(t => { if (t.parentTransactionId) additionalsOf.set(t.parentTransactionId, (additionalsOf.get(t.parentTransactionId) || []).concat(t)); });
  return mine.filter(t => !t.parentTransactionId || !mineIds.has(t.parentTransactionId)).map(head => {
    const main = byId.get(head.parentTransactionId || '') || head;
    return { head, additionals: (additionalsOf.get(head.id) || []).sort((a, b) => compareText(a.id, b.id)), description: (main.description || '').trim() };
  });
}
/* Saldo de la cuenta después de la transferencia: el de su última línea en esta cuenta. */
function balanceAfterTransfer(transfer, balances) {
  const withBalance = [transfer.head].concat(transfer.additionals).filter(l => balances.has(l.id));
  return withBalance.length > 0 ? balances.get(withBalance[withBalance.length - 1].id) : null;
}
/* V2-006: la página de una cuenta tiene dos vistas: «Movimientos» (completadas y pendientes de los próximos días, juntas por

  const live = head.status === 'CANCELLED' ? additionals : additionals.filter(a => a.status !== 'CANCELLED');
  const summed = live.length > 0 ? live : additionals;

  const sub = transfer.description ? transfer.description + (hasAdd ? ' + adicionales' : '') : hasAdd ? 'Adicionales' : '';
  if (isIos27()) return accountItemIos27(transfer, account, status, balances);   /* DIS-3 */
  return '<fin-account-transaction-item><button type="button" class="grp ' + state + '" data-act="open-detail" data-id="' + (head.parentTransactionId || head.id) + '">' +
    finAccountIcon(iconOfAccount(counterpart), counterpart.color, 'md', isCancelled) + '<span class="body">' +
    '<span class="title ' + state + '">' + (isCancelled && status !== 'CANCELLED' ? finChip('Cancelada') : '') + esc(counterpart.name) + '</span>' +
    '<span class="amt ' + state + (incoming ? ' in' : '') + '">' + sign + esc(formatMoney(head.amount)) + '</span>' +
    (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') +
    (hasAdd ? '<span class="amt sm' + (isCancelled || live.length === 0 ? ' cancelled' : '') + '">' + sign + esc(formatMoney(addTotal)) + '</span>' : '') +
    (after !== null ? '<span class="after">' + esc(formatMoney(after)) + '</span>' : '') + '</span></button></fin-account-transaction-item>';

/* DIS-3 (iOS 27): fila de un movimiento en la página de la cuenta
   1. un solo monto: la principal más sus adicionales vivas («+ adicionales» ya lo dice el subtítulo);
   2. el saldo después va debajo del monto con una flecha (→ $645,30);
   3. las pendientes dicen «Pendiente» (o «Automática») al inicio del subtítulo, además de las rayas. */
const isIos27 = () => document.documentElement.classList.contains('ios27');

PAGES.account = () => {
  const account = accountById(route.id);
  if (!account) { setTimeout(() => navigate('home'), 0); return ''; }   /* si la cuenta no existe, vuelve a Inicio */
  const status = view.accountStatus, type = typeById(account.accountTypeId);
  const canPay = account.status === 'ACTIVE' && !(type && type.direction === 'DESTINATION_ONLY');
  const today = toIsoDate(new Date()), groups = [];
  /* allTransactions va de la más reciente a la más antigua (también entre las pendientes) */
  let transfers = groupAccountTransfers(allTransactions(), account.id), balances;
  if (status === 'CANCELLED') {
    transfers = transfers.filter(t => t.head.status === 'CANCELLED');
    balances = new Map();
  } else {
    /* V2-006: completadas y pendientes hasta PENDING_WINDOW_DAYS días adelante, de la fecha más futura al pasado. En un mismo
       día, las pendientes van antes que las completadas (aún no ocurren). Cada pendiente muestra su saldo proyectado y cada
       completada su saldo después. */
    const limit = new Date(); limit.setDate(limit.getDate() + PENDING_WINDOW_DAYS);
    const lastDate = toIsoDate(limit), rank = t => t.head.status === 'PENDING' ? 0 : 1;
    /* V2-007: entre pendientes del mismo día, el orden inverso al de la proyección (lo último que se calcula, arriba), así cada

    const pendingOrder = (a, b) => a.head.status === 'PENDING' && b.head.status === 'PENDING' ? -compareForProjection(a.head, b.head, account.id) : 0;

    const html = accountItemHtml(t, account, status, balances); if (!html) return;

    finToolbarGroup({ actions: canPay ? [{ act: 'pay', icon: isIos27() ? 'plus' : 'send', ariaLabel: 'Pagar' }] : [], viewOptions: true, viewAriaLabel: 'Vista' });   /* DIS-3: «+» como en Calendario */
  return '<fin-account-page>' + finTopBar('Cuentas', 'Volver a cuentas', tools, compact) +
    '<fin-account-header' + (compact ? ' class="compact"' : '') + '><header class="acct-head">' + finAccountIcon(iconOfAccount(account), account.color, 'lg') + '<div class="acct-ht"><h1>' + esc(account.name) + '</h1><p class="balance' + (account.currentBalance < 0 && !(isIos27() && account.allowNegativeBalance) ? ' neg' : '') + '">' +   /* DIS-28 */
    esc(formatMoney(account.currentBalance) + (account.status === 'ACTIVE' ? '' : ' · Inactiva')) + '</p></div></header></fin-account-header>' +
    '<div class="list">' + groups.map(g => finDayGroup(g.title, g.items.join(''))).join('') + (groups.length ? '' : finEmptyState(EMPTY_MESSAGES[status])) + '</div></fin-account-page>';
};

  const dragged = handle.closest('fin-account-type-row'), rows = typeRowsOf(dragged), from = rows.indexOf(dragged), h = dragged.offsetHeight, y0 = e.clientY;   /* DIS-12: solo dentro de su grupo */

  };

/* Formulario de cuenta (fin-account-form) en una hoja. */
function openAccountForm(account) {
  const editing = !!account;
  const f = {
    name: account ? account.name : '', accountTypeId: account ? account.accountTypeId : '', initialText: account && account.initialBalance !== 0 ? fromCents(account.initialBalance) : '',
    color: account ? account.color : null, isOwn: account ? account.isOwn : true, isLiquid: account ? account.isLiquid : true, additionalOnly: account ? account.additionalOnly : false,
    allowNegativeBalance: account ? account.allowNegativeBalance : false, active: account ? account.status === 'ACTIVE' : true, typeHint: '', negTouched: editing,
    step: 'form', typeQuery: ''   /* DIS-27: paso «Tipo de cuenta» dentro de la hoja */
  };
  const typeOptions = () => db.accountTypes.slice().sort((a, b) => a.sortOrder - b.sortOrder)
    .filter(t => t.enabled || (account && t.id === account.accountTypeId)).map(t => ({ value: t.id, label: t.name }));
  /* DIS-27 (iOS 27): elegir el tipo en un paso de la hoja (como el selector de cuentas de una transferencia), con buscador y
     los tipos agrupados por dirección, en lugar de un menú largo que tapa la hoja */
  const typeListHtml = () => {
    const search = normalize(f.typeQuery.trim()), types = typeOptions().map(o => typeById(o.value)).filter(t => !search || normalize(t.name).includes(search));
    const groups = DIRECTION_ORDER.map(direction => {
      const list = types.filter(t => t.direction === direction);
      return list.length ? finSectionTitle(DIRECTION_NAME[direction]) + finListGroup(list.map(t =>
        '<fin-account-picker-row><button type="button" class="ap-row" role="option" aria-selected="' + (t.id === f.accountTypeId) + '" data-pick-type="' + t.id + '">' + finTypeIcon(t.icon) +
        '<span class="ap-n">' + esc(t.name) + '</span>' + (t.id === f.accountTypeId ? finIcon('check', 'ap-ok') : '') + '</button></fin-account-picker-row>').join('')) : '';
    }).join('');
    return groups || finEmptyState('Sin resultados para «' + f.typeQuery.trim() + '».');
  };
  const typePickerHtml = () => '<fin-account-picker class="type-picker">' + finSearchField('Buscar tipo', f.typeQuery) + '<div role="listbox" aria-label="Tipos de cuenta" id="typePickList">' + typeListHtml() + '</div></fin-account-picker>';
  const typeRowHtml = type => {
    const row = finSelectRow('folder-ui', 'Tipo', type ? type.name : 'Seleccionar', 'account-type');
    return isIos27() ? row.replace('aria-haspopup="menu" aria-expanded="false"', 'aria-haspopup="dialog"').replace('data-select="account-type"', 'data-type-pick').replace(finIcon('chevron-up-down'), finIcon('chevron-right')) : row;
  };
  const body = () => {
    if (f.step === 'type') return typePickerHtml();
    const type = typeById(f.accountTypeId), custom = f.color !== null && PALETTE.indexOf(f.color) < 0;
    /* DIS-26 (iOS 27): como la hoja de tipo de cuenta: el icono grande de la cuenta (con el tipo y el color elegidos) y el nombre en una tarjeta */
    const nameField = finTextField('Nombre', 'Nombre de la cuenta', f.name, 40, 'name');
    const head = isIos27() ? '<div class="ti-head ac-head"><div class="ti-prev">' + finAccountIcon(type ? type.icon : DEFAULT_ICON, f.color, 'lg') + '</div>' + nameField + '</div>' : nameField;
    return '<fin-account-form><form id="accountForm" novalidate>' + head +
      finListGroup(typeRowHtml(type) +
        /* V2 (bug 1): como en la app, el campo de saldo inicial es de texto con teclado decimal (inputmode="decimal"); sin tecla «−» en iOS no se puede escribir un negativo */
        finInputRow('money', 'Saldo inicial', 'amount', f.initialText, '0,00', 'initialText', { allowNegative: true, disabled: editing })) +
      finHint(f.typeHint) + (editing ? finHint('El saldo inicial no se puede cambiar.') : '') +
      finListGroup(finInfoRow('palette', 'Color', 'Opcional') + '<div class="swatches-row"><fin-color-picker><div class="swatches" role="radiogroup" aria-label="Color">' +
        '<button type="button" class="sw none" role="radio" aria-label="Sin color" aria-checked="' + (f.color === null) + '" data-color=""></button>' +
        PALETTE.map(c => '<button type="button" class="sw" role="radio" style="--c:' + c + '" aria-label="Color ' + c + '" aria-checked="' + (c === f.color) + '" data-color="' + c + '"></button>').join('') +
        '<span class="sw custom' + (custom ? ' set' : '') + '" role="radio" aria-checked="' + custom + '" style="--c:' + (f.color || '#808080') + '"><input type="color" value="' + (f.color || '#808080') + '" aria-label="Elegir otro color" data-field="customColor"></span>' +
        '</div></fin-color-picker></div>') +
      finListGroup(finSwitchRow('person', 'Cuenta propia', f.isOwn, 'isOwn') + (f.isOwn ? finSwitchRow('bolt', 'Disponible de inmediato', f.isLiquid, 'isLiquid') : '') +
        finSwitchRow('circle-plus', 'Solo como adicional', f.additionalOnly, 'additionalOnly') + finSwitchRow('circle-minus', 'Permitir saldo negativo', f.allowNegativeBalance, 'allowNegativeBalance') +
        (editing ? finSwitchRow('circle-check', 'Activa', f.active, 'active') : '')) +
      finHintHtml('<b>Cuenta propia:</b> su saldo es parte de tu dinero. <b>Disponible de inmediato:</b> el dinero se puede usar ya (no es ahorro programado, inversión ni tarjeta). <b>Solo como adicional:</b> no aparece como destino principal.') +
      '<div data-error>' + finFormError('') + '</div></form></fin-account-form>';

  const showError = m => { sheet.body.querySelector('[data-error]').innerHTML = finFormError(m); };
  const redraw = () => { sheet.body.innerHTML = body(); };
  const chooseType = v => {
    f.accountTypeId = v;   /* el error se limpia al volver a dibujar el formulario */
    const type = typeById(v);
    /* La nota de dirección aparece al elegir un tipo; un tipo solo origen (tarjeta) propone permitir saldo negativo, salvo que el usuario ya lo haya tocado */
    f.typeHint = type ? DIRECTION_NAME[type.direction] : '';
    if (type && !f.negTouched) f.allowNegativeBalance = type.direction === 'SOURCE_ONLY';
  };
  SELECTS['account-type'] = () => ({ label: 'Tipo de cuenta', options: typeOptions(), selected: f.accountTypeId, showIcons: false, onSelect: v => { chooseType(v); redraw(); } });
  /* DIS-27: abrir y cerrar el paso «Tipo de cuenta»; la flecha (o tocar fuera) vuelve al formulario sin cambiar nada */
  const formHeader = { title: editing ? 'Editar cuenta' : 'Nueva cuenta', subtitle: '', closeIcon: 'close', closeLabel: 'Cerrar', showConfirm: true, onClose: () => sheet.close() };
  const closeTypeStep = () => {
    f.step = 'form'; redraw();
    const form = sheet.body.querySelector('fin-account-form'); if (form) form.classList.add('ac-back');   /* el formulario regresa desde la izquierda */

    sheet.dialog.scrollTop = 0;
  };
  sheet.body.addEventListener('click', e => {
    if (e.target.closest('[data-type-pick]')) { openTypeStep(); return; }
    const option = e.target.closest('[data-pick-type]');
    if (option) { chooseType(option.dataset.pickType); closeTypeStep(); }

  sheet.body.addEventListener('input', e => {
    const k = e.target.dataset.field;
    if (k === 'query' && f.step === 'type') { f.typeQuery = e.target.value; sheet.body.querySelector('#typePickList').innerHTML = typeListHtml(); return; }   /* DIS-27 */
    if (k === 'name') { f.name = e.target.value; sheet.setConfirmDisabled(f.name.trim() === ''); }
    else if (k === 'initialText') f.initialText = e.target.value;

      sheet.body.querySelectorAll('.sw[data-color]').forEach(b => b.setAttribute('aria-checked', 'false'));
      const c = e.target.parentElement; c.classList.add('set'); c.style.setProperty('--c', f.color); c.setAttribute('aria-checked', 'true');
      const preview = sheet.body.querySelector('.ac-head fin-account-icon .avatar'); if (preview) preview.style.color = f.color;   /* DIS-26 */
    } else return;
    showError('');
  });
  sheet.body.addEventListener('change', e => {
    const k = e.target.dataset.field;
    if (['isOwn', 'isLiquid', 'additionalOnly', 'allowNegativeBalance', 'active'].indexOf(k) < 0) return;
    f[k] = e.target.checked; showError('');
    if (k === 'allowNegativeBalance') f.negTouched = true;
    if (k === 'isOwn') redraw();   /* «Disponible de inmediato» solo aparece en cuentas propias */
  });
  sheet.body.addEventListener('click', e => {
    const b = e.target.closest('.sw[data-color]'); if (!b) return;
    f.color = b.dataset.color || null; showError(''); redraw();
  });
  sheet.body.addEventListener('submit', e => {
    e.preventDefault();
    try {
      const data = { name: f.name, accountTypeId: f.accountTypeId, color: f.color, isOwn: f.isOwn, isLiquid: f.isOwn && f.isLiquid, additionalOnly: f.additionalOnly, allowNegativeBalance: f.allowNegativeBalance };
      /* El saldo inicial solo se define al crear; «Activa» solo existe al editar */
      if (editing) { data.status = f.active ? 'ACTIVE' : 'INACTIVE'; updateAccount(account.id, data); } else { data.initialBalance = toCents(f.initialText); createAccount(data); }
      sheet.close(); refresh();
    } catch (err) { showError(err instanceof ValidationError ? err.message : saveFail('la cuenta', err)); }
  });
}

  const f = { destinationId: editing ? destination.destinationAccountId : '', amountText: editing && destination.defaultAmount !== 0 ? fromCents(destination.defaultAmount) : '', description: editing ? destination.defaultDescription || '' : '', enabled: editing ? destination.enabled : true };

      finHint('Ambos valores se proponen al crear la transferencia y se pueden cambiar. La descripción solo se usa cuando este es el primer destino (la transacción principal); las adicionales no tienen descripción.') +
      '<div data-error>' + finFormError('') + '</div></form></fin-destination-form>';
  };
  const sheet = openSheet({ title: editing ? 'Editar destino' : 'Nuevo destino', confirmForm: 'destinationForm', confirmDisabled: !editing, body: body(), onClose: () => sheet.close() });
  const showError = m => { sheet.body.querySelector('[data-error]').innerHTML = finFormError(m); };
  SELECTS['destination-account'] = () => ({ label: 'Destino', showIcons: false, selected: f.destinationId,
    options: available.map(a => ({ value: a.id, label: a.name, hint: typeNameOf(a) })),
    onSelect: v => { f.destinationId = v; showError(''); sheet.body.innerHTML = body(); sheet.setConfirmDisabled(false); } });
  sheet.body.addEventListener('input', e => { const k = e.target.dataset.field; if (k === 'amountText' || k === 'description') { f[k] = e.target.value; showError(''); } });
  sheet.body.addEventListener('change', e => { if (e.target.dataset.field === 'enabled') { f.enabled = e.target.checked; showError(''); } });

      if (editing) { changes.enabled = f.enabled; updateDestination(source.id, destination.destinationAccountId, changes); }

/* -- Exportar e importar (fin-data-page) --
   V2: al entrar el campo se llena con los datos actuales; el primer toque ya revisa el JSON (validateImport) y el segundo reemplaza los datos. */
const IMPORT_LABEL = 'Importar', CONFIRM_LABEL = 'Toca de nuevo para reemplazar los datos';
PAGES.data = () => {
  if (isIos27()) return dataPageIos27();   /* DIS-20 */
  const d = view.data;
  return '<fin-data-page>' + finTopBar('Configuración', 'Volver a configuración', '') + '<h1>' + (isIos27() ? 'Exportar e importar' : 'Datos') + '</h1><p class="muted-p">Exporta todos los datos como JSON para guardarlos, o pega un JSON y reemplaza los datos actuales.</p>' +
    finListGroup(finActionRow('download', 'Exportar datos actuales', false, 'data-export') + finActionRow('copy', 'Copiar JSON', false, 'data-copy') + finActionRow('trash', 'Limpiar campo', true, 'data-clear')) +
    finSectionTitle('JSON') + '<textarea class="json-in" aria-label="JSON" spellcheck="false" autocapitalize="off" autocomplete="off" placeholder="Pega aquí el JSON a importar" id="dataJson">' + esc(d.json) + '</textarea>' +
    '<div id="dataError">' + finFormError(d.error) + '</div><p class="data-ok" role="status" id="dataOk">' + esc(d.ok) + '</p>' +
    finPrimaryButton(d.armed ? CONFIRM_LABEL : IMPORT_LABEL, 'block', 'dataImport') + finHint('Importar reemplaza todas las cuentas, tipos, destinos y transferencias actuales.') + '</fin-data-page>';
};
function dataMessage(error, ok) { view.data.error = error || null; view.data.ok = ok || ''; $('#dataError').innerHTML = finFormError(view.data.error); $('#dataOk').textContent = view.data.ok; }
function dataDisarm() { view.data.armed = null; const b = $('#dataImport'); if (b) b.textContent = IMPORT_LABEL; }
document.addEventListener('input', e => { if (e.target.id !== 'dataJson') return; view.data.json = e.target.value; dataMessage(); dataDisarm(); });
actions['data-export'] = () => { view.data.json = JSON.stringify(exportData(), null, 2); $('#dataJson').value = view.data.json; dataMessage(null, 'Datos actuales exportados.'); dataDisarm(); };
actions['data-clear'] = () => { view.data.json = ''; $('#dataJson').value = ''; dataMessage(); dataDisarm(); $('#dataJson').focus(); };
actions['data-copy'] = () => {
  if (!view.data.json) return dataMessage('No hay nada que copiar.');
  const fallback = () => { $('#dataJson').select(); document.execCommand('copy'); };
  (navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(view.data.json).catch(fallback) : Promise.resolve(fallback())).then(() => dataMessage(null, 'Copiado al portapapeles.'));
};
/* Doble toque: el primero revisa el JSON y pide confirmar; el segundo reemplaza los datos. */
document.addEventListener('click', e => {
  if (!e.target.closest('#dataImport')) return;
  if (!view.data.armed) {
    let data;
    try { data = JSON.parse(view.data.json); } catch (err) { dataDisarm(); return dataMessage('El texto no es un JSON válido: ' + err.message); }
    const problem = validateImport(data);
    if (problem) { dataDisarm(); return dataMessage('No se pudo importar. ' + problem); }
    view.data.armed = data; $('#dataImport').textContent = CONFIRM_LABEL; dataMessage();
    return;
  }
  const data = view.data.armed;
  try { importData(data); dataMessage(null, 'Datos importados: ' + data.accounts.length + ' cuentas y ' + data.transactions.length + ' transferencias.'); }
  catch (err) { dataMessage('No se pudo importar. ' + (err instanceof Error ? err.message : String(err))); }
  dataDisarm();
});

/* DIS-20 (iOS 27): Exportar e importar en dos secciones
   - Exportar: copiar los datos actuales o descargarlos como archivo, sin pasar por el campo de texto;
   - Importar: el campo empieza vacío y es más bajo; «Importar y reemplazar» va en rojo (borra los datos actuales) y
     confirma con la alerta de la app en lugar de tocar dos veces el mismo botón. */
function dataPageIos27() {
  const d = view.data;
  return '<fin-data-page class="ios27-page">' + finTopBar('Configuración', 'Volver a configuración', '') + '<h1>Exportar e importar</h1>' +

/* ---- 5.12 Hoja de transferencia y detalle (shared/transfer-sheet: fin-transfer-flow, fin-transfer-form, fin-account-picker, fin-transfer-detail) ----
   V2: la hoja abre directo en el formulario (el origen se elige en su fila; ya no hay pestañas ni tarjetas de origen) y el
   selector de cuentas con buscador reemplaza a los menús de cuenta. Se usa desde Transferencias, una cuenta y Estadísticas. */
const SHEET_HANDOFF_MS = 320;   /* espera para abrir una hoja justo después de cerrar otra */
const NO_SOURCES_MESSAGE = 'No hay cuentas que puedan enviar dinero. Créalas en Configuración › Cuentas.';
const NO_DESTINATIONS_MESSAGE = 'No hay cuentas disponibles. Configura los destinos de este origen en Configuración › Destinos permitidos.';

const errorMessage = (err, fallback) => { if (err instanceof ValidationError) return err.message; console.error(err); return fallback; };

/* ---- Formulario de transferencia ----
   V2-004: rediseño del formulario (resources/mock-formulario-transferencia.html):
   - el origen muestra un solo valor, lo que tendrá la cuenta, de solo lectura y en gris (sin «Saldo» ni «Queda»);
   - el destino principal muestra bajo su nombre un solo valor, lo que tendrá la cuenta; las adicionales, su tipo;

/* Nueva transferencia: abre directo en el formulario. Con fixedSourceId («Pagar» desde una cuenta) el origen ya viene puesto. */
function openTransferSheet(fixedSourceId) {
  F = { draft: null, fixedSourceId: fixedSourceId || null, sourceId: fixedSourceId || null, description: '', date: toIsoDate(new Date()), autoComplete: false, rows: [], nextKey: 0,
    newRowKey: -1, defaultDescription: '', balanceAdjustments: {}, error: null, step: 'form', pick: null, editSubtitle: '',

/* Editar: la principal y sus adicionales vivas. */
function openEditSheet(parentId) {

  if (!parent || parent.status === 'CANCELLED') return;
  const rows = [parent].concat(transfer.slice(1).filter(a => a.status !== 'CANCELLED'));
  /* Si se devuelve lo ya completado, el origen recupera su monto y los destinos lo pierden */
  const adjustments = {};
  rows.filter(r => r.status === 'COMPLETED').forEach(r => {
    adjustments[r.sourceAccountId] = (adjustments[r.sourceAccountId] || 0) + r.amount;
    adjustments[r.destinationAccountId] = (adjustments[r.destinationAccountId] || 0) - r.amount;
  });
  F = { draft: { id: parent.id }, fixedSourceId: null, sourceId: parent.sourceAccountId, description: parent.description || '', date: parent.estimatedCompletionDate, autoComplete: parent.autoComplete,

}

  if (F.step === 'custom') return { title: 'Personalizado', subtitle: '', showConfirm: true, closeIcon: 'back', closeLabel: 'Volver' };   /* V2-008 */
  if (F.recurring) return recurringFormTitles();
  return { title: F.draft ? 'Editar transferencia' : 'Nueva transferencia', subtitle: F.draft ? F.editSubtitle : F.sourceId ? 'Define el destino y el valor' : 'Define el origen, el destino y el valor', showConfirm: true, closeIcon: 'close', closeLabel: 'Cerrar' };

/* Saldos de antes de esta transferencia (al editar, sin el efecto de lo ya completado) */

const formTotal = () => F.rows.reduce((n, r) => n + r.amount, 0);

const conceptsComplete = () => !F.breakdown || F.breakdown.every(c => cleanName(c.concept) !== '' && c.amount > 0);

function sourceValueHtml() {

}
/* V2-004: conceptos del desglose bajo el destino principal, en la misma tarjeta */
function conceptsHtml() {
  return F.breakdown.map((c, i) => '<fin-concept-row><div class="cr">' +
    '<button type="button" class="cr-del" aria-label="Quitar concepto ' + (i + 1) + '" data-act="remove-concept" data-index="' + i + '">' + finIcon('circle-minus') + '</button>' +
    '<input class="cr-name" type="text" maxlength="' + MAX_CONCEPT_LENGTH + '" autocomplete="off" placeholder="Concepto" aria-label="Concepto ' + (i + 1) + '" value="' + esc(c.concept) + '" data-concept="' + i + '">' +
    '<input class="cr-amt" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00" aria-label="Valor del concepto ' + (i + 1) + '" value="' + esc(c.amountText) + '" data-amount data-concept-amount="' + i + '">' +
    '</div></fin-concept-row>').join('') +

}
function transferFormHtml() {
  const source = accountById(F.sourceId), fixed = F.fixedSourceId !== null, future = isFutureDate();
  const additionalOptions = source ? allowedAccounts(source.id, true) : [];
  const used = F.rows.map(r => r.accountId);
  const canAdd = source !== undefined && additionalOptions.some(a => used.indexOf(a.id) < 0);
  const noDestinations = !!source && !db.accountDestinations.some(d => d.sourceAccountId === source.id && d.enabled);
  /* V2-004: el origen lleva solo su nombre y un valor */
  const sourceRow = '<fin-source-row><button type="button" class="irow"' + (fixed ? ' disabled' : ' aria-haspopup="dialog"') + ' aria-label="Origen: ' + (source ? esc(source.name) : 'seleccionar cuenta') + '" data-act="pick-source">' +
    (source ? accountIconOf(source) + '<span class="dpick-t"><b>' + esc(source.name) + '</b></span>' + sourceValueHtml()

  const rows = F.rows.map((row, index) => {
    const account = accountById(row.accountId), additional = index > 0;
    /* V2-004: bajo el nombre, el principal lleva lo que tendrá la cuenta; las adicionales, su tipo */
    /* V2-008: en una recurrente no se ven saldos; el principal también lleva su tipo */
    const subtitle = !account ? 'Seleccionar cuenta' : additional || F.recurring ? esc(typeNameOf(account)) : '<span id="destValue">' + esc(formatMoney(mainDestinationValue())) + '</span>';
    const amount = !additional && F.breakdown

    const cells = '<button type="button" class="dpick"' + (source ? '' : ' disabled') + ' aria-haspopup="dialog" aria-label="' + (additional ? 'Adicional ' + index : 'Destino') + ': ' + (account ? esc(account.name) : 'seleccionar cuenta') + '" data-act="pick-destination" data-index="' + index + '">' +
      (account ? accountIconOf(account) : finIcon(additional ? 'additional' : 'receive', 'ic')) +
      '<span class="dpick-t"><b' + (account ? '' : ' class="ph"') + '>' + esc(account ? account.name : additional ? 'Adicional' : 'Destino') + '</b><small class="dst-value">' + subtitle + '</small></span>' + finIcon('chevron-up-down', 'chev') + '</button>' +
      '<span class="dst-val">' + amount + '</span>' +
      /* V2-004: el botón de desglose solo está mientras no hay conceptos */
      (!additional && account && !F.breakdown ? '<button type="button" class="bk-btn" aria-label="Desglosar el valor de ' + esc(account.name) + '" data-act="open-breakdown">' + finIcon('list') + '</button>' : '');

      : '<div class="drow">' + cells + '</div>') + '</fin-destination-row>' +
