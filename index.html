  Un solo archivo: <style> (CSS de los componentes Angular), HTML mínimo y un <script> en JavaScript puro.
  Cómo editarlo:
    · Estilos ... un bloque por componente, con la ruta de su archivo .css de Angular (busca «/* --- fin-»).
    · Pantallas . en el <script>, sección 5: una función por componente (finListGroup, finSelectRow…) y una por página (PAGES.home…).
    · Reglas .... sección 4 del <script>: los servicios (cuentas, tipos, destinos, transacciones, exportar/importar).
    · Datos ..... al final del <script> (DATOS_INICIALES). Para empezar sin datos, deja las cuatro listas vacías.
    · Cambios ... los comentarios «V2:» marcan lo que difiere del prototipo.html de la versión 1.
  Cada cambio que se modele aquí se registra en resources/prototipo-v2-cambios.md antes de llevarlo a Angular.
-->
<style>
/* ===== Estilos globales (src/styles) ===== */
/* --- src/styles/tokens.css --- */
/* Tokens de diseño: colores, fuentes, vidrio (Liquid Glass) y curvas de animación, con su versión oscura. */
:root{
  /* Colores al estilo iOS (colores del sistema, fondo agrupado) */
  --bg:#FFFFFF; --raised:#F2F2F7; --ink:#000000; --ink-2:#6C6C70; --ink-3:#8E8E93; --line:#C6C6C8;
  --accent:#007AFF; --accent-soft:rgba(0,122,255,.12); --ok:#248A3D; --warn:#B25000; --warn-soft:rgba(255,149,0,.16);
  --bad:#FF3B30; --bad-soft:rgba(255,59,48,.12); --mute-soft:rgba(120,120,128,.12);
  --seg-sel:#FFFFFF; --toggle-off:#E9E9EA; --nav-bg:rgba(249,249,249,.82);

  /* Vidrio: nivel fijo en toda la app (--glass-a: .2, cercano a «Más claro»); la tinta se calcula a partir de él */
  --glass-a:.2; --glass-filo:rgba(0,0,0,.14);
  --glass-tinte:rgba(255,255,255,calc(.06 + var(--glass-a) * .86));
  --glass-tinte-hover:rgba(255,255,255,calc(.14 + var(--glass-a) * .8));
  --glass-borde:rgba(255,255,255,.5);
  --glass-brillo:rgba(255,255,255,.95); --glass-brillo-inferior:rgba(255,255,255,.2); --glass-sombra:rgba(0,0,0,.15);
  --glass-texto:#1d1d1f; --glass-fallback:rgba(255,255,255,.85); --glass-reflejo:rgba(255,255,255,.55); --glass-reflejo-2:rgba(255,255,255,.15);

  /* Fuentes */
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif;

  /* Curvas de animación: --ease-ios para presentaciones, --ease-spring con ligero rebote para controles */
  --ease-ios:cubic-bezier(.32,.72,0,1); --ease-spring:cubic-bezier(.34,1.36,.64,1); --ease-out-ios:cubic-bezier(.4,0,1,1);
}

/* Modo oscuro: automático según el sistema, salvo que se fuerce el claro con data-theme="light" */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --raised:#1C1C1E; --ink:#FFFFFF; --ink-2:#A1A1A6; --ink-3:#8E8E93; --line:#38383A;
    --accent:#0A84FF; --accent-soft:rgba(10,132,255,.2); --ok:#30D158; --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.2);
    --bad:#FF453A; --bad-soft:rgba(255,69,58,.2); --mute-soft:rgba(120,120,128,.24);
    --seg-sel:#636366; --toggle-off:#39393D; --nav-bg:rgba(30,30,30,.82);
    --glass-filo:rgba(0,0,0,.6);
    --glass-tinte:rgba(28,28,30,calc(.1 + var(--glass-a) * .82)); --glass-tinte-hover:rgba(48,48,52,calc(.35 + var(--glass-a) * .55));
    --glass-borde:rgba(255,255,255,.15);
    --glass-brillo:rgba(255,255,255,.4); --glass-brillo-inferior:rgba(255,255,255,.08); --glass-sombra:rgba(0,0,0,.4);
    --glass-texto:#f5f5f7; --glass-fallback:rgba(30,30,30,.9); --glass-reflejo:rgba(255,255,255,.18); --glass-reflejo-2:rgba(255,255,255,.05);
    color-scheme:dark;
  }
}

/* Modo oscuro forzado con data-theme="dark" (mismos valores que el bloque anterior) */
:root[data-theme="dark"]{
  --bg:#000000; --raised:#1C1C1E; --ink:#FFFFFF; --ink-2:#A1A1A6; --ink-3:#8E8E93; --line:#38383A;
  --accent:#0A84FF; --accent-soft:rgba(10,132,255,.2); --ok:#30D158; --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.2);
  --bad:#FF453A; --bad-soft:rgba(255,69,58,.2); --mute-soft:rgba(120,120,128,.24);
  --seg-sel:#636366; --toggle-off:#39393D; --nav-bg:rgba(30,30,30,.82);
  --glass-filo:rgba(0,0,0,.6);
  --glass-tinte:rgba(28,28,30,calc(.1 + var(--glass-a) * .82)); --glass-tinte-hover:rgba(48,48,52,calc(.35 + var(--glass-a) * .55));
  --glass-borde:rgba(255,255,255,.15);
  --glass-brillo:rgba(255,255,255,.4); --glass-brillo-inferior:rgba(255,255,255,.08); --glass-sombra:rgba(0,0,0,.4);
  --glass-texto:#f5f5f7; --glass-fallback:rgba(30,30,30,.9); --glass-reflejo:rgba(255,255,255,.18); --glass-reflejo-2:rgba(255,255,255,.05);
  color-scheme:dark;
}
/* --- src/styles/base.css --- */
/* Base: tamaño de texto dinámico, box-sizing, body, título principal, botones y campos en iOS. */

/* Tamaño de texto dinámico (Dynamic Type de iOS): 1rem = cuerpo del sistema (17 pt por defecto) */
html{font-size:17px; -webkit-text-size-adjust:100%; text-size-adjust:100%}
@supports (font: -apple-system-body){html{font:-apple-system-body}}

*{box-sizing:border-box}

body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:1rem; line-height:1.3; letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0;
}

h1{font-family:var(--font-display); font-size:2rem; font-weight:700; line-height:1.1; letter-spacing:-.02em; margin:0; overflow-wrap:anywhere}

button{font:inherit; color:inherit}
:where(button):focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* iOS amplía la página si un campo tiene menos de 16 px al enfocarlo */
@supports (-webkit-touch-callout: none){input,select,textarea{font-size:max(16px, 1rem) !important}}
/* --- src/styles/utilities.css --- */
/* Utilidades globales: clases sueltas que no pertenecen a ningún componente. */

/* Texto solo para lectores de pantalla */
.sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
/* --- src/styles/accessibility.css --- */
/* Accesibilidad global: ajustes de tokens según las preferencias del sistema. */

/* Aumentar contraste: vidrio casi opaco y bordes marcados */
@media (prefers-contrast: more){
  :root{--glass-a:1; --glass-filo:rgba(0,0,0,.45); --line:#8E8E93}
}
/* --- Material de vidrio compartido: shared/ui/styles/glass.css (clase .glass) --- */
/* Material de vidrio líquido compartido (botones circulares y barra de pestañas).
   Se incluye en cada componente con styleUrls y se activa con class="glass" en su elemento.
   Capas: desenfoque, tinte, borde, brillo especular, sombra y reflejo diagonal (::before). */
.glass{
  position:relative; overflow:hidden; isolation:isolate;
  border:1px solid var(--glass-borde);
  background:var(--glass-tinte);
  -webkit-backdrop-filter:blur(calc(3px + var(--glass-a) * 27px)) saturate(190%);
  backdrop-filter:blur(calc(3px + var(--glass-a) * 27px)) saturate(190%);
  box-shadow:0 0 0 .5px var(--glass-filo), inset 0 1px 0 var(--glass-brillo), inset 0 -1px 0 var(--glass-brillo-inferior), inset 1px 1px 1px var(--glass-brillo-inferior), 0 8px 28px var(--glass-sombra);
  transition:transform .3s cubic-bezier(.175,.885,.32,2.2), background .3s ease, box-shadow .3s ease;
}
.glass::before{
  content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; pointer-events:none;
  background:linear-gradient(135deg, var(--glass-reflejo) 0%, transparent 40%, transparent 60%, var(--glass-reflejo-2) 100%);
}

/* Botones de vidrio: respuesta al puntero y al foco */
button.glass{cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center}
button.glass:hover{background:var(--glass-tinte-hover); transform:scale(1.05)}
button.glass:active{transform:scale(.97); opacity:1}
button.glass:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

/* Sin backdrop-filter: fondo casi opaco */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
  .glass{background:var(--glass-fallback)}
}
/* Aumentar contraste: vidrio casi opaco */
@media (prefers-contrast: more){
  .glass{background:var(--glass-fallback)}
}
/* Reducir transparencia: sin desenfoque */
@media (prefers-reduced-transparency: reduce){
  .glass{background:var(--glass-fallback); -webkit-backdrop-filter:none; backdrop-filter:none}
}
/* Reducir movimiento: sin transiciones ni escala */
@media (prefers-reduced-motion: reduce){
  .glass{transition:none}
  button.glass:hover{transform:none}
}

/* ===== Componentes (un bloque por componente; :host se escribe como la etiqueta fin-*) ===== */

/* --- fin-account-icon · shared/ui/icons/fin-account-icon/fin-account-icon --- */
fin-account-icon{display:inline-flex; flex:none}
/* Medio (36 px) por defecto; --aicon-size, --aicon-radius y --aicon-glyph lo ajustan donde el prototipo usa 32 o 30 px */
fin-account-icon .avatar{flex:none; width:var(--aicon-size, 36px); height:var(--aicon-size, 36px); border-radius:var(--aicon-radius, 9px); background:var(--mute-soft); color:var(--ink-2); display:flex; align-items:center; justify-content:center}

fin-account-icon .aicon.lg fin-icon{width:28px; height:28px; stroke-width:1.7}
fin-account-icon .aicon.sm{width:28px; height:28px; border-radius:7px}
fin-account-icon .aicon.sm fin-icon{width:16px; height:16px}

fin-account-icon .aicon.xs fin-icon{width:14px; height:14px; stroke-width:2}

fin-account-icon .aicon.muted{opacity:.45}

/* --- fin-avatar · shared/ui/icons/fin-avatar/fin-avatar --- */
fin-avatar{display:inline-flex; flex:none}
fin-avatar .avatar{flex:none; width:var(--avatar-size,40px); height:var(--avatar-size,40px); border-radius:50%; background:var(--mute-soft); color:var(--ink-2); display:flex; align-items:center; justify-content:center; font-size:var(--avatar-font,.8235rem); font-weight:600; letter-spacing:.02em}
fin-avatar .avatar.lg{width:52px; height:52px; font-size:1rem}
fin-avatar .avatar.sm{width:34px; height:34px; font-size:.7059rem}

/* --- fin-icon · shared/ui/icons/fin-icon/fin-icon --- */
/* El tamaño (width/height del host), el color (color) y el grosor (stroke-width del host) los pone el contenedor. */
fin-icon{display:inline-block; width:24px; height:24px; stroke-width:1.8}
fin-icon svg{display:block; width:100%; height:100%; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round}
/* Los puntos del icono «list» van rellenos */
fin-icon svg .dot{fill:currentColor; stroke:none}

/* --- fin-settings-icon · shared/ui/icons/fin-settings-icon/fin-settings-icon --- */
fin-settings-icon{display:inline-flex; flex:none}
/* --c es el color de fondo; el icono va siempre en blanco */
fin-settings-icon .sicon{flex:none; width:30px; height:30px; border-radius:8px; background:var(--c); color:#fff; display:flex; align-items:center; justify-content:center}
fin-settings-icon .sicon fin-icon{width:18px; height:18px; stroke-width:2}

fin-back-button{display:inline-flex; flex:none}

fin-back-button .back{flex:none; width:44px; height:44px; border-radius:50%; color:var(--accent)}
fin-back-button .back fin-icon{width:22px; height:22px; stroke-width:2.4; flex:none}
/* Con texto: píldora con chevron y nombre de la pantalla anterior */
fin-back-button .back.back-text{width:auto; border-radius:999px; padding:0 16px 0 10px; gap:2px; font:inherit; font-size:1rem; font-weight:400; transition:padding .32s var(--ease-ios)}

/* Compacto: el texto se pliega y queda el chevron */
fin-back-button .back.back-text.compact{padding:0 11px}
fin-back-button .back-text.compact span{max-width:0; opacity:0}

/* --- fin-close-button · shared/ui/buttons/fin-close-button/fin-close-button --- */
fin-close-button{display:inline-flex; flex:none}

fin-close-button .sheet-x{flex:none; width:44px; height:44px; border-radius:50%; color:var(--glass-texto)}

/* --- fin-confirm-button · shared/ui/buttons/fin-confirm-button/fin-confirm-button --- */
fin-confirm-button{display:inline-flex; flex:none}

fin-destination-form{display:block}

/* --- fin-list-item-row · features/settings/components/fin-list-item-row/fin-list-item-row --- */
/* El separador y las esquinas del estado :active los resuelve cada fila según su posición en el grupo */
fin-list-item-row{position:relative; display:block}
fin-list-item-row:not(:first-child)::before{content:""; position:absolute; top:0; left:66px; right:18px; border-top:.5px solid var(--line); pointer-events:none}
fin-list-item-row .irow{display:flex; align-items:center; gap:12px; width:100%; min-height:60px; margin:0; padding:6px 18px; background:none; border:0; border-radius:0; font:inherit; font-size:1rem; color:var(--ink); text-align:left; cursor:pointer}
fin-list-item-row .irow:active{background:var(--mute-soft)}
fin-list-item-row:first-child .irow:active{border-top-left-radius:26px; border-top-right-radius:26px}
fin-list-item-row:last-child .irow:active{border-bottom-left-radius:26px; border-bottom-right-radius:26px}
fin-list-item-row .irow:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:26px}
fin-list-item-row .dpick-t{flex:1; min-width:0; display:flex; flex-direction:column; line-height:1.25}
fin-list-item-row .dpick-t b{font-weight:400; font-size:1rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
fin-list-item-row .dpick-t small{font-size:.8235rem; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
fin-list-item-row .irow fin-avatar{--avatar-size:36px; --avatar-font:.7647rem}
fin-list-item-row .irow-val{display:flex; align-items:center; gap:6px; color:var(--ink-3)}
fin-list-item-row .irow-val fin-icon{width:15px; height:15px; stroke-width:2}
fin-list-item-row .lrow-v{font-variant-numeric:tabular-nums}
/* Inactiva: se atenúa el icono y el texto pasa a gris */
fin-list-item-row .off .dpick-t b, fin-list-item-row .off .lrow-v{color:var(--ink-3)}
fin-list-item-row .off fin-account-icon, fin-list-item-row .off fin-avatar{opacity:.5}

/* --- fin-account-types-page · features/settings/pages/fin-account-types-page/fin-account-types-page --- */
fin-account-types-page{display:block; max-width:720px; margin:0 auto; padding-block:8px 110px}

/* --- fin-accounts-page · features/settings/pages/fin-accounts-page/fin-accounts-page --- */
fin-accounts-page{display:block; max-width:720px; margin:0 auto; padding-block:8px 110px}
/* Cada grupo va pegado a su título; el primero deja 16 px bajo el título de la pantalla */
fin-accounts-page fin-list-group{--group-gap:6px}
fin-accounts-page fin-section-title:first-of-type{margin-top:-8px}

/* --- fin-data-page · features/settings/pages/fin-data-page/fin-data-page --- */
fin-data-page{display:block; max-width:720px; margin:0 auto; padding-block:8px 110px}
fin-data-page .muted-p{margin:6px 0 0; color:var(--ink-3)}
/* El título trae 24 px arriba; aquí van 22 */
fin-data-page fin-section-title{margin-top:-2px}
/* Campo del JSON: tarjeta blanca como los grupos de filas */
fin-data-page .json-in{display:block; width:100%; min-height:45vh; resize:vertical; padding:12px 14px; background:#FFFFFF; color:var(--ink); border:.5px solid var(--line); border-radius:20px; box-shadow:0 2px 10px rgba(0,0,0,.06);
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:.7353rem; line-height:1.5; white-space:pre; overflow:auto; -webkit-overflow-scrolling:touch}
fin-data-page .json-in:focus-visible{outline:2px solid var(--accent); outline-offset:0}
fin-data-page .data-ok{color:var(--ok); font-size:.8824rem; margin:14px 0 0 16px}
fin-data-page .data-ok:empty{display:none}
/* Modo oscuro: automático (sistema) y forzado con data-theme="dark" */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) fin-data-page .json-in{background:#1C1C1E}
}
:root[data-theme="dark"] fin-data-page .json-in{background:#1C1C1E}

/* --- fin-destination-detail-page · features/settings/pages/fin-destination-detail-page/fin-destination-detail-page --- */
fin-destination-detail-page{display:block; max-width:720px; margin:0 auto; padding-block:8px 110px}
fin-destination-detail-page > p{margin:6px 0 0; color:var(--ink-3)}
/* Bajo el texto el prototipo deja 16 px; fin-list-group deja 20 px (--group-gap) */
fin-destination-detail-page fin-list-group{--group-gap:16px}

/* --- fin-destinations-page · features/settings/pages/fin-destinations-page/fin-destinations-page --- */
fin-destinations-page{display:block; max-width:720px; margin:0 auto; padding-block:8px 110px}
fin-destinations-page > p{margin:6px 0 0; color:var(--ink-3)}
/* Bajo el texto el prototipo deja 16 px; fin-list-group deja 20 px (--group-gap) */
fin-destinations-page fin-list-group{--group-gap:16px}

/* --- fin-settings-page · features/settings/pages/fin-settings-page/fin-settings-page --- */
fin-settings-page{display:block; max-width:720px; margin:0 auto; padding-block:8px 110px}
/* Bajo el título de la pantalla, la sección «Estructura» deja 16 px y su grupo va pegado al título */
fin-settings-page fin-section-title:first-of-type{margin-top:-8px}
fin-settings-page fin-list-group{--group-gap:6px}
/* Nota bajo el grupo: 8 px arriba y 18 px a los lados */
fin-settings-page fin-hint{padding:2px 2px 0}

/* --- V2-008 · Transacciones recurrentes: fin-recurring-page, fin-recurring-account-page y el paso «Personalizado» --- */
fin-recurring-page, fin-recurring-account-page{display:block; max-width:720px; margin:0 auto; padding-block:8px 110px}
fin-recurring-page > p, fin-recurring-account-page > p{margin:6px 0 0; color:var(--ink-3)}
fin-recurring-page fin-list-group, fin-recurring-account-page fin-list-group{--group-gap:16px}
fin-recurrence-custom{display:block; animation:ap-push .36s cubic-bezier(.32,.72,0,1) both}
fin-recurrence-custom .rc-panel{padding:12px}
fin-recurrence-custom fin-segmented-control .tabs{margin-bottom:8px}
.rc-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:4px}
.rc-grid.months{grid-template-columns:repeat(4, 1fr)}
.rc-grid.ordinals{grid-template-columns:repeat(5, 1fr); margin-bottom:8px}
.rc-grid button{min-height:40px; border:0; border-radius:999px; background:none; color:var(--ink); font:inherit; font-size:1rem; cursor:pointer}
.rc-grid:not(.months):not(.ordinals) button{aspect-ratio:1}
.rc-grid button[aria-pressed="true"]{background:var(--accent); color:#fff; font-weight:600}
@media (prefers-reduced-motion: reduce){ fin-recurrence-custom{animation:none} }
/* En la hoja de una recurrente no se ven saldos (ni el del origen ni los del selector de cuentas) */
fin-bottom-sheet.recurring .src-value, fin-bottom-sheet.recurring .ap-v{display:none}
/* ==========================================================================================
   DISEÑO iOS 27 · DIS-1: pantalla Cuentas (lista y formulario de cuenta)
   Referencia: capturas de iOS 27 (Calendario › nuevo evento y recordatorio, vista de mes).
   - Fondo agrupado gris (#F2F2F7) con tarjetas blancas sin borde ni sombra, esquinas de 26 px.
   - Títulos de sección en frase normal (no MAYÚSCULAS), 17 px seminegrita y gris.
   - Filas más altas, márgenes de 20 px y separadores que empiezan donde empieza el texto.
   - Icono de cuenta: color sólido con el glifo en blanco (DIS-15: cuadrado redondeado, como las listas de iOS).
   - Botones de vidrio con el texto y los iconos en negro (no azules).
   - Interruptores verdes; hojas con el mismo fondo agrupado.
   ========================================================================================== */
:root.ios27{
  --raised:#F2F2F7; --group-bg:#F2F2F7; --card:#FFFFFF; --card-in-sheet:#FFFFFF;
  --ink-3:#8A8A8E; --line:rgba(60,60,67,.18); --chev:#C4C4C7; --switch-on:#34C759; --plain-icon:#8E8E93;
}
@media (prefers-color-scheme: dark){
  :root.ios27:not([data-theme="light"]){ --raised:#1C1C1E; --group-bg:#000000; --card:#1C1C1E; --card-in-sheet:#2C2C2E;
    --ink-3:#8D8D93; --line:rgba(84,84,88,.6); --chev:#5A5A5E; --switch-on:#30D158; --plain-icon:#636366 }
}
:root.ios27[data-theme="dark"]{ --raised:#1C1C1E; --group-bg:#000000; --card:#1C1C1E; --card-in-sheet:#2C2C2E;
  --ink-3:#8D8D93; --line:rgba(84,84,88,.6); --chev:#5A5A5E; --switch-on:#30D158; --plain-icon:#636366 }

/* Fondo agrupado */
:root.ios27 body{background:var(--group-bg)}

/* Título grande: 34 px, alineado con el texto de las tarjetas */
:root.ios27 fin-accounts-page h1{font-size:2rem; font-weight:700; letter-spacing:-.02em; margin:4px 4px 0}

/* Títulos de sección: frase normal, seminegrita, gris */
:root.ios27 fin-section-title .section{font-size:1rem; font-weight:600; text-transform:none; letter-spacing:-.01em; color:var(--ink-3)}
:root.ios27 fin-section-title .set-sec{margin:28px 20px 8px}
:root.ios27 fin-accounts-page fin-section-title:first-of-type{margin-top:0}
:root.ios27 fin-accounts-page fin-list-group{--group-gap:0}

/* Tarjetas: blancas, sin borde ni sombra */
:root.ios27 fin-list-group .igroup{background:var(--card); border:0; box-shadow:none; border-radius:26px; padding:0}
:root.ios27 fin-bottom-sheet fin-list-group .igroup{background:var(--card-in-sheet)}

/* Filas de la lista: 64 px con dos líneas, márgenes de 20 px, separador desde el texto */
:root.ios27 fin-list-item-row .irow{min-height:64px; padding:8px 20px; gap:14px}
:root.ios27 fin-list-item-row:not(:first-child)::before{left:66px; right:20px; border-top-color:var(--line)}
:root.ios27 fin-list-item-row .dpick-t{line-height:1.3}
:root.ios27 fin-list-item-row .dpick-t b{font-size:1rem}
:root.ios27 fin-list-item-row .dpick-t small{font-size:.882rem; color:var(--ink-3)}
:root.ios27 fin-list-item-row .irow-val{color:var(--chev)}
:root.ios27 fin-list-item-row .irow-val fin-icon{width:14px; height:14px; stroke-width:2.6}

/* Icono de cuenta: círculo de color sólido con el glifo blanco; sin color, gris */
/* DIS-15: cuadrado redondeado (23 % del lado, como los iconos de las listas de iOS) con un ligero degradado */
:root.ios27 fin-account-icon .avatar{--aicon-size:32px; border-radius:23%; background:linear-gradient(180deg, color-mix(in srgb, var(--plain-icon) 78%, #fff), var(--plain-icon))}
/* el color de la cuenta viene en style="color:…" */
:root.ios27 fin-account-icon .avatar[style]{background:linear-gradient(180deg, color-mix(in srgb, currentColor 78%, #fff), currentColor) !important}
:root.ios27 fin-account-icon .avatar fin-icon{color:#FFFFFF}
:root.ios27 fin-account-icon .aicon fin-icon{--aicon-glyph:18px; stroke-width:2}
:root.ios27 fin-list-item-row .off fin-account-icon{opacity:.4}

/* Barra superior: vidrio con texto e iconos en negro */
:root.ios27 fin-back-button .back{color:var(--ink)}
:root.ios27 fin-back-button .back fin-icon{stroke-width:2.6}
:root.ios27 fin-toolbar-group .tg-btn{color:var(--ink)}
:root.ios27 fin-toolbar-group .tg-btn.on{color:var(--accent)}

/* Hoja: fondo agrupado opaco, botones de 52 px, título de 17 px */
:root.ios27 fin-bottom-sheet .sheet{background:var(--group-bg); -webkit-backdrop-filter:none; backdrop-filter:none; border-radius:34px 34px 0 0}
@media (prefers-color-scheme: dark){ :root.ios27:not([data-theme="light"]) fin-bottom-sheet .sheet{background:#1C1C1E} }
:root.ios27[data-theme="dark"] fin-bottom-sheet .sheet{background:#1C1C1E}
:root.ios27 fin-sheet-header .sheet-head.scrolled{background:color-mix(in srgb, var(--group-bg) 92%, transparent)}
:root.ios27 fin-close-button .sheet-x, :root.ios27 fin-confirm-button .sheet-done, :root.ios27 fin-sheet-header .nh-spacer{width:52px; height:52px}
:root.ios27 fin-close-button .sheet-x{color:var(--ink)}
:root.ios27 fin-close-button .sheet-x fin-icon{width:20px; height:20px; stroke-width:2.4}
:root.ios27 fin-confirm-button .sheet-done fin-icon{width:24px; height:24px}
:root.ios27 fin-sheet-header h2{font-size:1rem; font-weight:600}

/* Campo de texto en píldora: blanco, sin borde ni sombra */
:root.ios27 fin-text-field .f-in.f-pill{height:56px; border-radius:28px; padding:0 20px; background:var(--card-in-sheet); border:0; box-shadow:none}

/* Filas del formulario: 54 px, márgenes de 20 px, iconos grises, separador desde el texto */
:root.ios27 fin-input-row .irow, :root.ios27 fin-select-row .irow, :root.ios27 fin-switch-row .irow{min-height:56px; padding:6px 20px; gap:16px}
:root.ios27 fin-input-row:not(:first-child)::before, :root.ios27 fin-select-row:not(:first-child)::before, :root.ios27 fin-switch-row:not(:first-child)::before{left:60px; right:20px; border-top-color:var(--line)}
:root.ios27 fin-input-row .irow fin-icon, :root.ios27 fin-select-row .irow > fin-icon, :root.ios27 fin-switch-row .irow fin-icon{width:24px; height:24px; color:var(--ink-3); stroke-width:1.7}
:root.ios27 fin-select-row .irow-val fin-icon{color:var(--ink-3)}

/* Notas bajo los grupos: 15 px, alineadas con el texto */
:root.ios27 fin-hint .f-hint{font-size:.882rem; line-height:1.35; margin:8px 20px 0}

/* Interruptores verdes */
:root.ios27 fin-switch .f-check input:checked{background:var(--switch-on)}

/* ==========================================================================================
   DISEÑO iOS 27 · DIS-2: página de una cuenta
   - Encabezado: icono circular de color, nombre como título grande y el saldo destacado debajo.
   - Cada día es una sección: título gris en seminegrita («Hoy» en rojo, como en Calendario) y sus movimientos en una
     tarjeta blanca con separadores desde el texto, sobre el fondo agrupado.
   - Filas de 20 px de margen; subtítulo y saldo después en gris de 15 px; las pendientes conservan las rayas
     (Calendario también las usa).
   ========================================================================================== */
:root.ios27 fin-account-header .acct-head{gap:14px; padding:0 4px}
:root.ios27 fin-account-header .aicon.lg{width:48px; height:48px}
:root.ios27 fin-account-header .aicon.lg fin-icon{width:26px; height:26px}
:root.ios27 fin-account-header h1{font-size:2rem; letter-spacing:-.02em}
:root.ios27 fin-account-header .balance{margin:4px 0 0; font-size:1.647rem; line-height:1.15; font-weight:600; letter-spacing:-.01em; color:var(--ink)}
:root.ios27 fin-account-header .balance.neg{color:var(--bad)}
:root.ios27 fin-account-page fin-account-header{margin:10px 0 4px}

/* En las listas agrupadas de iOS el título de sección se desplaza con su tarjeta (no queda fijo) */
/* DIS-16: el día como título de nota de iOS: grande, en negrita y en negro (también «Hoy») */
:root.ios27 fin-account-page fin-day-group .day.sticky{position:static; padding:24px 4px 10px; border-bottom:0; background:var(--group-bg); font-size:1.294rem; font-weight:700; letter-spacing:-.01em; color:var(--ink)}
:root.ios27 fin-account-page fin-day-group + fin-day-group{margin-top:0}
:root.ios27 fin-day-group .list{padding:0; background:var(--card); border-radius:26px; overflow:hidden}

:root.ios27 fin-account-transaction-item{position:relative; margin:0}
:root.ios27 fin-account-transaction-item + fin-account-transaction-item::before{content:""; position:absolute; z-index:1; top:0; left:66px; right:20px; border-top:.5px solid var(--line); pointer-events:none}
:root.ios27 fin-account-transaction-item .grp{gap:14px; padding:12px 20px; border-radius:0}
:root.ios27 fin-account-transaction-item fin-account-icon{margin-top:2px}
:root.ios27 fin-account-transaction-item .sub{font-size:.882rem; color:var(--ink-3)}
:root.ios27 fin-account-transaction-item .after{font-size:.882rem; color:var(--ink-3)}
:root.ios27 fin-account-transaction-item .amt.sm{font-size:.882rem}

/* DIS-3: «Pendiente» en el subtítulo y el título compacto de la barra */
:root.ios27 fin-account-transaction-item .sub .st{font-weight:600; color:var(--warn)}
:root.ios27 fin-account-page .tb-mini b{font-size:1rem; font-weight:600}
:root.ios27 fin-account-page .tb-mini small{font-size:.8235rem; font-weight:500; color:var(--ink-2)}

/* DIS-4: página Transferencias (barra arriba, título grande, control segmentado y días en tarjetas) */
:root.ios27 fin-transfers-page.ios27-page .tr-top{display:flex; justify-content:flex-end; flex:none; min-height:44px; margin-bottom:14px}
:root.ios27 fin-transfers-page.ios27-page > h1{flex:none; margin:0 4px 12px; font-size:2rem; letter-spacing:-.02em}
:root.ios27 fin-transfers-page.ios27-page fin-segmented-control{flex:none}
:root.ios27 fin-transfers-page.ios27-page fin-segmented-control .tabs{margin-bottom:0; padding:4px}
:root.ios27 fin-transfers-page.ios27-page fin-segmented-control .tab{padding:8px 12px; font-size:.882rem}
/* DIS-17: el día como título de nota, igual que en una cuenta */
:root.ios27 fin-transfers-page fin-day-group .day.sticky{position:static; padding:24px 4px 10px; border-bottom:0; background:var(--group-bg); font-size:1.294rem; font-weight:700; letter-spacing:-.01em; color:var(--ink)}
:root.ios27 fin-transfers-page fin-day-group + fin-day-group{margin-top:0}
:root.ios27 fin-transfers-page fin-empty-state{padding:24px 0}
:root.ios27 fin-account-transaction-item .sub.wide{grid-column:1 / -1}   /* sin saldo a la derecha, el subtítulo usa todo el ancho */

/* DIS-5: Inicio (barra arriba, fecha, título y filas de cuenta) */
/* DIS-21: barra arriba, título debajo y la fecha en gris bajo el título (como la descripción de las demás páginas) */
:root.ios27 fin-home-page .home-head{display:flex; justify-content:flex-end; min-height:44px; margin-bottom:14px}
:root.ios27 fin-home-page .home-title{margin:0 4px; font-size:2rem; line-height:1.1; letter-spacing:-.02em}
:root.ios27 fin-home-page .home-date{margin:6px 4px 0; color:var(--ink-3)}
/* DIS-14: título de grupo con la suma a la derecha (alineada con el borde derecho del contenido de la tarjeta) */
:root.ios27 fin-home-page .home-sec{display:flex; justify-content:space-between; gap:12px; margin-right:20px}
:root.ios27 fin-home-page .home-sec .sec-total{font-weight:600; color:var(--ink-3); font-variant-numeric:tabular-nums; white-space:nowrap}
/* DIS-14: filas como las listas de iOS: icono cuadrado redondeado de color con el glifo blanco y el saldo en gris */
:root.ios27 fin-account-row.home-row .irow{min-height:52px; gap:16px}
:root.ios27 fin-account-row.home-row fin-account-icon .avatar{--aicon-size:30px}
:root.ios27 fin-account-row.home-row fin-account-icon .aicon fin-icon{width:18px; height:18px}
:root.ios27 fin-account-row.home-row:not(:first-child)::before{left:66px}
:root.ios27 fin-account-row.home-row .irow-val{gap:8px; color:var(--ink-3)}
:root.ios27 fin-account-row.home-row .ar-bal{color:var(--ink-3)}
:root.ios27 fin-home-page fin-account-section:first-of-type{margin-top:0}
:root.ios27 fin-home-page fin-list-group{--group-gap:0}
:root.ios27 fin-account-row .irow{min-height:56px; padding:8px 20px; gap:14px}
:root.ios27 fin-account-row:not(:first-child)::before{left:66px; right:20px; border-top-color:var(--line)}
:root.ios27 fin-account-row .irow-val fin-icon{width:14px; height:14px; stroke-width:2.6; color:var(--chev)}

/* Fila «Ver las N» / «Ver menos» al pie de una tarjeta (desgloses de Estadísticas) */
fin-home-more{display:block; position:relative}
fin-home-more::before{content:""; position:absolute; top:0; left:20px; right:20px; border-top:.5px solid var(--line)}
fin-home-more button{display:flex; align-items:center; justify-content:space-between; width:100%; min-height:48px; padding:0 20px; border:0; background:none; font:inherit; color:var(--accent); cursor:pointer}
fin-home-more fin-icon{width:14px; height:14px; stroke-width:2.6; color:var(--chev)}

/* DIS-7: Estadísticas
   - el título a la misma altura que en las páginas con barra; el total en una tarjeta;
   - el desglose con su relleno (las barras no tocan el borde) y las filas de movimientos como en Transferencias. */
:root.ios27 fin-stats-page.ios27-page > h1{margin:58px 4px 14px; font-size:2rem; letter-spacing:-.02em}
:root.ios27 fin-stats-page.ios27-page fin-stats-total .st-total{align-items:flex-start; gap:2px; padding:16px 20px 18px; border-radius:26px; background:var(--card); text-align:left}
:root.ios27 fin-stats-page.ios27-page fin-stats-total .st-lab{font-size:.882rem; font-weight:600; text-transform:none; color:var(--ink-3)}
:root.ios27 fin-stats-page.ios27-page fin-stats-total b{font-size:2.118rem; line-height:1.15}
:root.ios27 fin-stats-page.ios27-page fin-stats-total .st-meta{margin-top:4px}
:root.ios27 fin-list-group .igroup.brk{padding:8px 20px 12px}
:root.ios27 fin-breakdown-row .brk-amt{color:var(--ink)}
:root.ios27 fin-breakdown-row .brk-n{gap:12px}
:root.ios27 fin-stats-filters .date-row{padding:6px 20px 6px 40px}
:root.ios27 fin-stats-filters .date-row::before{left:60px; right:20px}

/* DIS-8: píldoras de filtro y desglose corto */
:root.ios27 .st-chips{position:relative; margin:0 -16px 14px; --menu-top:calc(100% + 6px); --menu-right:16px}
:root.ios27 .st-chips-in{display:flex; gap:6px; padding:0 16px; overflow-x:auto; scrollbar-width:none}
:root.ios27 .st-chips-in::-webkit-scrollbar{display:none}
:root.ios27 .st-chips fin-select-row.chip{flex:none}

<!-- V2: la estructura repite la de la app Angular: app-root (outlet + barra de pestañas) y, aparte, las hojas y alertas.

<script>
/* ==========================================================================================
   PROTOTIPO V2 · Libro de Cuentas
   Reproduce la app Angular actual (rama v2). Estado en memoria; los datos iniciales salen de
   resources/version30-10-26.json (constante DATOS_INICIALES, al final de este script).

   Organización:
     1. Utilidades ........... fechas, dinero y texto           (src/app/core/utils)
     2. Constantes ........... iconos, paleta, etiquetas         (src/app/core/constants)
     3. Estado ............... "base de datos" en memoria        (src/app/core/data)
     4. Servicios ............ reglas de negocio                 (src/app/core/services)
     5. Interfaz ............. componentes, hojas, pantallas y   (src/app/features, src/app/shared)
                               flujo de transferencias; la pantalla Datos (exportar/importar) es la 5.11
     6. Barra inferior ....... pestañas
     7. Arranque ............. carga de DATOS_INICIALES (al final del script)

   Los comentarios «V2:» marcan lo que cambia respecto de prototipo.html (versión 1).
   ========================================================================================== */

/* ===== 1. Utilidades (core/utils) ===== */
const MONTHS = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const DAY_NAMES = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

/* Fecha local en formato ISO: "2026-10-28". */
const toIsoDate = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parseIsoDate = s => { const p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
/* Encabezado de los grupos por día: "Lunes, 26 oct". */
const dayTitle = d => DAY_NAMES[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
const dateShort = d => d.getDate() + ' ' + MONTHS[d.getMonth()];
const dateLong = d => d.toLocaleDateString('es', { day: 'numeric', month: 'short', year: 'numeric' }).replace('.', '').replace(/ de /g, ' ');
const dateTime = d => dateLong(d) + (d.getHours() || d.getMinutes() ? ', ' + d.toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' }) : '');
/* V2: fecha de Inicio con el mes completo: "Jueves, 29 octubre" (homeDate de fin-home-page). */
const homeDate = d => DAY_NAMES[d.getDay()] + ', ' + d.getDate() + ' ' + d.toLocaleDateString('es', { month: 'long' });

let numberFormat;
try { numberFormat = new Intl.NumberFormat('es-EC', { style: 'currency', currency: 'USD' }); }
catch (e) { numberFormat = { format: n => '$' + n.toFixed(2) }; }
/* Centavos a moneda; el negativo lleva el signo menos tipográfico (−). */
const formatMoney = c => (c < 0 ? '−' : '') + numberFormat.format(Math.abs(c) / 100);

/* Montos escritos a mano: se acepta coma o punto como separador decimal. */
function toCents(text) {
  let s = String(text || '').replace(/\s/g, '');
  const isNegative = s.charAt(0) === '-';
  s = s.replace(/[^0-9.,]/g, '');
  const k = Math.max(s.lastIndexOf(','), s.lastIndexOf('.'));
  const amount = k < 0 ? Number(s) : Number(s.slice(0, k).replace(/[.,]/g, '') + '.' + s.slice(k + 1).replace(/[.,]/g, ''));
  return (isNegative ? -1 : 1) * Math.round((amount || 0) * 100);
}
const fromCents = c => (c / 100).toFixed(2).replace('.', ',');
/* V2: limpia lo que se escribe en un campo de monto. Los miles se escriben sin separador (1234,50):
   un punto o una coma siempre es el separador decimal. */
function cleanAmountInput(text, allowNegative) {
  const isNegative = !!allowNegative && text.trim().charAt(0) === '-';
  let s = text.replace(/[^0-9.,]/g, '');
  const k = s.search(/[.,]/);
  if (k >= 0) s = s.slice(0, k + 1) + s.slice(k + 1).replace(/[.,]/g, '').slice(0, 2);
  return (isNegative ? '-' : '') + s;
}

/* Iniciales del avatar. */
function initials(name) {
  const w = name.split(/\s+/).filter(Boolean);
  return (w.length > 1 ? w[0][0] + w[1][0] : name.slice(0, 2)).toUpperCase();
}
/* Sin tildes y en minúsculas, para buscar. */
const normalize = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
/* Sin espacios al inicio ni al final, y uno solo entre palabras. */
const cleanName = n => n.trim().replace(/\s+/g, ' ');
const esc = v => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const compareText = (a, b) => a < b ? -1 : a > b ? 1 : 0;
const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });

/* ===== 2. Constantes (core/constants) ===== */
const STATUS_NAME = { COMPLETED: 'Completada', PENDING: 'Pendiente', CANCELLED: 'Cancelada' };
const DIRECTION_NAME = { BOTH: 'Origen y destino', SOURCE_ONLY: 'Solo origen', DESTINATION_ONLY: 'Solo destino' };
